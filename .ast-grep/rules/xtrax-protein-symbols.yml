---
id: xtrax-protein-symbols-guard
language: python
severity: error
message: |
  xtrax modules must NOT reference aminx protein-specific symbols.

  Protected symbols:
    - atom_37 (37-atom PDB standard, protein-structure-dependent)
    - residue_index (PDB residue numbering, protein-structure-dependent)
    - tie_group_map (amino acid tying for symmetric design, protein design-specific)

  These symbols are defined in aminx.types.bundles and represent protein-domain
  assumptions that violate xtrax's domain-agnostic interface.

  See ADR 260605_potts-parallel-not-stageset.md and 260611_xtrax-foundations for rationale.

files:
  - 'src/xtrax/**/*.py'

rule:
  any:
    # Direct variable reference: atom_37
    - pattern: atom_37
    # Direct variable reference: residue_index
    - pattern: residue_index
    # Direct variable reference: tie_group_map
    - pattern: tie_group_map
