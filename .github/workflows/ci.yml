name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Install dependencies and run tests
        run: |
          uv sync --extra cpu --extra dev --extra tests

          # Determine marker expression based on event type
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Pull request: running fast tests (excluding slow, parity_heavy, parity_audit)."
            MARKER="not slow and not parity_heavy and not parity_audit"
          else
            echo "Push to main: excluding parity_heavy and parity_audit (run in parity workflows)."
            MARKER="not parity_heavy and not parity_audit"
          fi

          uv run pytest -n auto --cov=src --cov-report=xml --cov-report=term -m "$MARKER"
      - name: Upload coverage to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
