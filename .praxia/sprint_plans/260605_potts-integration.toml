[orchestration]
# sequential: total ordering — all tracks execute strictly one at a time.
# concurrent: empty — all tracks (including doc-writing tracks) use fixer+reviewer pair
#   and must not race on the git working tree.
#
# Dependency rationale for sequential order:
#   A(ProteinFeatures recon) → B(ADR) → C(weights) → J(caliby scaffold, needs calibration.py
#   before K) → M(import boundary, needs B's ADR) → D(model, needs A's recon finding) →
#   L(alphabet, writes to model.py so needs D's model.py) → E(spec) → G(sampling) → H(poe) →
#   F(tests, needs D+L) → I(CLI, needs E) → N(poe-sanity, needs D+H) →
#   K(runner, needs C+D+E+G+H+I+J for calibration.py) → O(designer, needs D+G+L)
