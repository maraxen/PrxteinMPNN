[sprint]
sprint_id = "260611_xtrax-foundations"
sprint_num = 1
name = "260611_xtrax-foundations — aminx→xtrax P0 foundations + training adoption"
description = """
First executable slice of the aminx→xtrax refactor (EPIC #1541, spec
.praxia/docs/specs/260611_aminx-xtrax-refactor.md). Lands the no-flag foundations
(py3.13 bump, editable xtrax pin, cluster smoke, boundary-lint) plus the idea-2
"free win" training adoption (ResumableState + xtrax optimizer). Excludes the two
user-decision TBDs (#1546 T-R2, #1547 T-R3b) and everything they gate.
Stack: uv + ty + ruff + pytest (NOT cargo). All commands use `uv run`.
"""
context = """
VALIDATED GROUND TRUTH (Wave-1+2 recon; full model in
.praxia/docs/research/260611_aminx-xtrax-refactor-codebase-model.md):
- aminx currently imports NOTHING from xtrax (greenfield). xtrax v0.2.0 on PyPI, requires py>=3.13.
- A1 (VALIDATED live): under requires-python ">=3.12", `uv add --editable ../xtrax` fails the
  WHOLE lock (uv resolves all env splits; the 3.12 split is unsatisfiable). After bumping the floor
  to >=3.13 AND updating both [tool.uv.environments] markers, it resolves (219 pkgs) and import works.
  Active interpreter here is 3.13.12; cluster uses `uv run python` (no version pin) so 3.13 is fine.
- A4 (VALIDATED): ruff TID251 banned-api keys are literal aminx.* paths (only potts/designer.py exempt);
  xtrax.* is inherently unbanned, so the first xtrax.* import silently bypasses ADR 260605 unless an
  equivalent boundary guard lands in the SAME change.
- Dependency order in this sprint: 1542 → 1543 → {1544, 1545} ; 1548 needs 1543 AND 1545.
  A valid linear order is 1542,1543,1544,1545,1548. 1544 (cluster smoke) may run concurrently with
  the 1545→1548 branch if the runner supports it.
Per-track fixer/reviewer prompts below are review-ready; confirm before `dw emit-sprint`.
"""
max_fix_retries = 1
worktree_shadow_mode = false

[[tracks]]
id = "a"
is_research = false
worktree = false
skip_worktree = false

[[tracks.items]]
backlog_id = "1542"
phase_name = "Track A — [xtrax T0.1] Bump aminx to Python >=3.13 (#1542)"
fixer_prompt = """
task_id: 260611_xtrax-refactor-spec. Edit-only; one concern. Stack: uv/Python (NOT cargo).

OBJECTIVE: Raise aminx's Python floor to 3.13 so it can depend on xtrax (which requires >=3.13).

ANCHORS (verify before editing):
- pyproject.toml:9 — `requires-python = ">=3.12"` → change to `">=3.13"`.
- pyproject.toml `[tool.uv.environments]` — TWO environment markers currently say
  `python_version >= '3.12'`; change BOTH to `python_version >= '3.13'`. (grep: `rg -n "tool.uv.environments|python_version" pyproject.toml`.)

WHY (validated): under >=3.12 uv resolves a 3.12 env split that cannot satisfy xtrax>=3.13, failing the
whole lock (Wave-2 A1). Bumping the floor + both markers is the proven fix.

DO NOT: add the xtrax dependency here (that is #1543/Track B). Touch only pyproject.toml.

SUCCESS CRITERIA:
- `rg -n 'requires-python|python_version' pyproject.toml` shows 3.13 everywhere.
- `uv lock` succeeds.
- `uv run pytest -q -m 'not parity_heavy and not slow'` is green on 3.13.
Report the exact pyproject diff and the uv lock + pytest tail.
"""
reviewer_prompt = """
task_id: 260611_xtrax-refactor-spec. Reviewer (HAS Bash). Stack: uv/Python.

VERIFY (run):
- `rg -n 'requires-python|python_version' pyproject.toml` → all show 3.13 (floor + BOTH [tool.uv.environments] markers).
- `uv lock` exits 0 (no resolution error).
- `uv run python --version` → 3.13.x.
- `uv run pytest -q -m 'not parity_heavy and not slow'` → green (no NEW failures vs baseline).
- No file other than pyproject.toml / uv.lock changed (`git diff --name-only`).
PASS iff all hold. FAIL with the failing command output otherwise.
"""
return_key = "1542"

[[tracks]]
id = "b"
is_research = false
worktree = false
skip_worktree = false

[[tracks.items]]
backlog_id = "1543"
phase_name = "Track B — [xtrax T0.2] Add editable xtrax pin + dependency (#1543)"
fixer_prompt = """
task_id: 260611_xtrax-refactor-spec. Edit-only; one concern. Depends on #1542 (py3.13 floor) — must be merged first. Stack: uv/Python.

OBJECTIVE: Add xtrax as a dependency pinned to a LOCAL editable checkout for lockstep dev.

ANCHORS:
- pyproject.toml `[project].dependencies` (~lines 10-31) — add `"xtrax>=0.2.0"`.
- pyproject.toml `[tool.uv.sources]` (~line 263; currently pins `proxide`, `torch` to pypi) — add
  `xtrax = { path = "../xtrax", editable = true }`. Pin the path EXPLICITLY as `../xtrax`
  (do NOT run `uv add` and trust its cwd-derived relative path — Wave-2 A1b showed it emits a wrong
  climbing path from a worktree).

DO NOT: change requires-python (done in #1542). Do not import xtrax in any source file yet
(the first xtrax.* import is gated on the boundary-lint #1545 landing atomically).

SUCCESS CRITERIA:
- `uv lock` resolves with xtrax present.
- `uv run python -c "import xtrax; print(xtrax.__version__)"` prints `0.2.0`.
Report the pyproject diff and the import output.
"""
reviewer_prompt = """
task_id: 260611_xtrax-refactor-spec. Reviewer (HAS Bash). Stack: uv/Python.

VERIFY:
- pyproject [project].dependencies contains xtrax; [tool.uv.sources] has `xtrax = { path = "../xtrax", editable = true }` with the literal `../xtrax` path.
- `uv lock` exits 0.
- `uv run python -c "import xtrax; print(xtrax.__version__)"` → `0.2.0`.
- `rg -n "import xtrax|from xtrax" src` → NO source imports yet (import only added once #1545 boundary-lint lands).
PASS iff all hold. FAIL with output otherwise.
"""
return_key = "1543"

[[tracks]]
id = "c"
is_research = false
worktree = false
skip_worktree = false

[[tracks.items]]
backlog_id = "1544"
phase_name = "Track C — [xtrax T0.3] L3 cluster smoke: py3.13 + JAX on SM120 + bathos sidecar (#1544)"
fixer_prompt = """
task_id: 260611_xtrax-refactor-spec. Depends on #1543. Stack: uv/Python + SLURM (myxcel). New file allowed (sbatch + bathos sidecar).

OBJECTIVE: Prove the py3.13 + JAX/jaxlib toolchain runs on the target Blackwell SM120 cluster nodes
BEFORE any cluster perf gate trusts it (AS4 / R3a / pre-mortem PM-c).

DO:
- Create `scripts/cluster/smoke_py313_jax.sbatch` following the existing pattern in
  `scripts/cluster/recapture_pottsmpnn.sbatch` (anchor: `_PROJ`, `uv sync --quiet`, `uv run python`,
  and the Blackwell guard `if [[ "${_NODE}" == *node4007* || *node4008* ]]; then export
  XLA_FLAGS="...--xla_gpu_shard_autotuning=false"; fi`). The job: `uv run python -c` that imports jax,
  prints jax.__version__ + jax.devices(), and runs one tiny jit'd matmul on GPU.
- Add a bathos sidecar that RECORDS resolved jaxlib version, hostname, and confirmation that XLA_FLAGS
  was applied (per the BATHOS verify-the-pipeline rule).
- Submit via myxcel/sbatch with `--array=0-0` on the SM120 partition; wait for completion.

SUCCESS CRITERIA:
- L1: `bash -n scripts/cluster/smoke_py313_jax.sbatch` parses.
- L3: the array job completes successfully; the log shows a real GPU device and a non-hung matmul
  (NOT the 1170x autotuning-hung profile); bathos sidecar captured jaxlib version + hostname + XLA_FLAGS-applied.
Report the job id, the log tail, and the sidecar contents.
"""
reviewer_prompt = """
task_id: 260611_xtrax-refactor-spec. Reviewer (HAS Bash + myxcel). Stack: uv/Python + SLURM.

VERIFY:
- `bash -n scripts/cluster/smoke_py313_jax.sbatch` exits 0; script anchors to its own dir (no bare relative paths) and contains the node4007/4008 XLA_FLAGS guard.
- The submitted array job reached COMPLETED (`sacct`); log shows a GPU device and a successful jit matmul.
- Bathos sidecar recorded jaxlib version, hostname, and XLA_FLAGS-applied.
PASS iff the toolchain demonstrably runs on a real SM120 node. FAIL (and BLOCK downstream perf gates) otherwise.
"""
return_key = "1544"

[[tracks]]
id = "d"
is_research = false
worktree = false
skip_worktree = false

[[tracks.items]]
backlog_id = "1545"
phase_name = "Track D — [xtrax T0.4] Boundary-lint + ruff banned-api for xtrax.* (#1545)"
fixer_prompt = """
task_id: 260611_xtrax-refactor-spec. Depends on #1543. Stack: uv/Python + ruff. New lint file allowed.

OBJECTIVE: Preserve ADR 260605 boundary discipline across the xtrax move (A4). ruff TID251 bans only
aminx.* paths; xtrax.* is unbanned, so the first xtrax.* import would silently bypass the boundary.
This guard MUST be mergeable atomically with the first xtrax.* import in any later slice.

ANCHORS:
- pyproject.toml `[tool.ruff.lint.flake8-tidy-imports.banned-api]` (~lines 137-141) bans
  aminx.inference.decode / aminx.host.plan / aminx.types.stages / aminx.inference.logits (ADR 260605).
- `.ast-grep/` rules dir exists (see also backlog #1304's ast-grep potts-isolation rule as a pattern).

DO (two halves, both required):
(a) An import-boundary check that aminx protein modules do not reach into xtrax internals they
    shouldn't (mirror the ADR's intent for the moved-to-xtrax surfaces).
(b) A check asserting xtrax stays protein-AGNOSTIC: no xtrax module references the symbols
    `atom_37`, `residue_index`, `tie_group_map`. Implement as an ast-grep rule (preferred, matches
    repo convention) or a small pytest that greps xtrax's source; wire it into CI.

SUCCESS CRITERIA:
- The check is green on the current tree.
- Injecting a violation (e.g. a temp xtrax module referencing `atom_37`) makes it FAIL; removing it passes again.
- `uv run ruff check .` and the new check both pass.
Report the rule/file added and the inject-fail/clean-pass demonstration.
"""
reviewer_prompt = """
task_id: 260611_xtrax-refactor-spec. Reviewer (HAS Bash). Stack: uv/Python + ruff/ast-grep.

VERIFY:
- Both halves exist: (a) protein-module→xtrax-internals guard, (b) xtrax-protein-agnostic guard (no atom_37/residue_index/tie_group_map).
- Demonstrate it FAILS on an injected violation and PASSES once removed (run it both ways).
- `uv run ruff check .` exits 0; the new check is wired into CI / pre-commit.
PASS iff the guard is real and enforced. FAIL otherwise.
"""
return_key = "1545"

[[tracks]]
id = "e"
is_research = false
worktree = false
skip_worktree = false

[[tracks.items]]
backlog_id = "1548"
phase_name = "Track E — [xtrax T1.1-1.2] Adopt xtrax ResumableState + optimizer (#1548)"
fixer_prompt = """
task_id: 260611_xtrax-refactor-spec. Depends on #1543 AND #1545 (boundary-lint must land with the first xtrax import). Stack: uv/Python. Edit-only on the named files; this is the first real xtrax.* import.

OBJECTIVE: Rebuild aminx's training state + optimizer setup on xtrax primitives (the idea-2 "free win"
where xtrax is already at-or-ahead; no feature flag).

ANCHORS:
- aminx `src/aminx/training/trainer.py`: `create_optimizer()` (~lines 73-106, inline
  optax.warmup_cosine_decay + clip_by_global_norm) and the (model, opt_state, start_step) state
  threading (~lines 125-199).
- xtrax targets: `xtrax.training.ResumableState` (xtrax/src/xtrax/training/types.py:43 — step/key/model/opt_state/extras),
  `xtrax.training.optim.adamw_with_schedule` + `make_optimizer` (xtrax/src/xtrax/training/optim.py).

DO:
- Replace the (model, opt_state, step) tuple threading with a single `ResumableState`.
- Replace `create_optimizer()` internals with `adamw_with_schedule(...)` / `make_optimizer(...)`,
  mapping aminx's TrainingSpecification fields (learning_rate, warmup_steps, total_steps, weight_decay,
  gradient_clip) onto the xtrax builder args.
- KEEP in aminx: domain losses (losses.py), metrics, diffusion (diffusion.py / train_diffusion.py),
  dataloading. Do NOT move them.
- Repoint imports and update affected tests under `tests/training/`.

DO NOT: change checkpoint format (that is #1549, gated on the T-R2 decision). Do not touch tiling/host.

SUCCESS CRITERIA:
- `uv run ty check` and `uv run ruff check .` pass.
- `uv run pytest -q tests/training -m 'not slow'` green.
- A short smoke training run reproduces the legacy loss/accuracy curve within numerical tolerance.
Report the diff per file, the test tail, and the loss-curve comparison.
"""
reviewer_prompt = """
task_id: 260611_xtrax-refactor-spec. Reviewer (HAS Bash). Stack: uv/Python.

VERIFY:
- Training state is xtrax.training.ResumableState; optimizer built via xtrax adamw_with_schedule/make_optimizer (inline optax.chain removed).
- Domain losses/metrics/diffusion/dataloading remain in aminx (`rg -n 'cross_entropy_loss|NoiseSchedule' src/aminx/training` still resolves locally).
- The first xtrax import is covered by the #1545 boundary-lint (it is green).
- `uv run ty check` clean; `uv run ruff check .` clean; `uv run pytest -q tests/training -m 'not slow'` green.
- Smoke run loss curve within tolerance of legacy.
PASS iff all hold. FAIL with command output otherwise.
"""
return_key = "1548"

[orchestration]
# Dependency-topological linear order (always-correct). 1542→1543 gate all; 1545→1548; 1544 needs only 1543.
# Optional parallelism for the runner: 1544 (cluster smoke) may run concurrently with the 1545→1548 branch.
sequential = ["1542", "1543", "1544", "1545", "1548"]
concurrent = []
