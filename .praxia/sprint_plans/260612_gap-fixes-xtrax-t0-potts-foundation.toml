phase_name = "Track G — P-00b: ADR — Potts is a parallel model family, NOT a StageSet consumer (#1303)"
fixer_prompt = """
task_id: 260612_gap-fixes-xtrax-t0-potts-foundation
workspace: /home/marielle/projects/aminx

Objective: Write an Architecture Decision Record locking the boundary: PottsModel lives in
aminx.potts as a parallel model family and does NOT consume StageSet or InferencePlan.
Output: .praxia/docs/decisions/260605_potts-parallel-not-stageset.md

Context already established (do NOT re-derive — use this directly):
- Option II rejected: decode_step signature is (node_f, edge_f, nei, mask) → (L,V) logits;
  Potts needs raw backbone coordinates as input and returns (marginals, h, J, rho) — interface mismatch
- Option III rejected: EncoderOutput is load-bearing across the entire aminx inference stack;
  widening it to carry Potts-specific fields creates downstream coupling
- Option IV rejected: ProductOfProbabilities (aminx.inference.logits) cannot express pairwise
  J coupling — it operates on per-residue logit vectors with no residue-residue terms

Decision: PottsModel operates on raw coordinates, produces Potts parameters (h, J), runs TRW
marginals internally, and exposes a sampling interface. It is a sibling to Aminx at the
aminx.potts namespace level — not a plugin or StageSet stage.

Steps:
1. Check if .praxia/docs/decisions/260605_potts-parallel-not-stageset.md already exists;
   if so, augment it rather than replacing it
2. Write the ADR using this structure:
   ---
   status: Accepted
   date: 2026-06-05
   ---
   # ADR: Potts is a parallel model family, not a StageSet consumer
   ## Status / Context / Decision / Consequences / Rejected alternatives
3. Ensure the Rejected alternatives section covers II, III, IV with the exact reasoning above
4. Update .praxia/docs/INDEX.md
5. Do NOT modify any .py source files — documentation only"""
