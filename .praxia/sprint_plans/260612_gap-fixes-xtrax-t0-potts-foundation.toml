phase_name = "Track B — [Gap 2] Read spec.fixed_mask in _prepare_fixed_controls alongside spec.fixed_positions (#1754)"
fixer_prompt = """
task_id: 260612_gap-fixes-xtrax-t0-potts-foundation
workspace: /home/marielle/projects/aminx

Objective: In src/aminx/host/_sampling_helper.py, make _prepare_fixed_controls respect
spec.fixed_mask when it is set directly. Edit only — one file.

Background:
- _prepare_fixed_controls (line 438) builds fixed_mask_np as np.zeros, then fills it from
  spec.fixed_positions if not None (line 448-456)
- spec.fixed_mask (ArrayLike | None) is a separate field that callers can set directly as
  a (batch_size, seq_len) float32 array — but the function ignores it entirely
- A caller that sets spec.fixed_mask without setting spec.fixed_positions silently gets zeros

Fix: After the opening `fixed_mask_np = np.zeros(...)` at line 445, add a branch:

  if spec.fixed_mask is not None:
      fixed_mask_np = np.asarray(spec.fixed_mask, dtype=np.float32)
      if fixed_mask_np.ndim == 1:
          fixed_mask_np = np.broadcast_to(
              fixed_mask_np[None, :], (batch_size, seq_len)
          ).copy()
      if fixed_mask_np.shape != (batch_size, seq_len):
          msg = f"fixed_mask must have shape ({batch_size}, {seq_len}), got {fixed_mask_np.shape}"
          raise ValueError(msg)
  elif spec.fixed_positions is not None:
      ... (existing fixed_positions branch, unchanged)

The fixed_mask branch should take precedence over (replace, not combine with) the
fixed_positions branch — spec.fixed_mask is an explicit mask, fixed_positions is a
convenience shorthand that builds the mask.

Also verify what fields spec.fixed_mask has by checking src/aminx/run/specs.py:305 first.

Steps:
1. Read src/aminx/run/specs.py around SamplingSpecification (line 305) to confirm the
   field name, type annotation, and default value
2. Read src/aminx/host/_sampling_helper.py:438-473 to see the exact current structure
3. Edit _sampling_helper.py to add the branch above
4. Run: uv run ty check src/aminx/host/_sampling_helper.py"""
