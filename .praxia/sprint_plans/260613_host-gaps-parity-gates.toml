[sprint]
sprint_id = "260613_host-gaps-parity-gates"
sprint_num = 2
name = "260613_host-gaps-parity-gates"
description = "Fix three silent host-dispatch bugs (STE, fixed_mask, atom_37), validate checkpoint clean-break training parity, complete RS-1 inventory to unblock RS-2+, and run T0.3 cluster smoke to unblock T2 tiling."
context = '''
Prior sprint (260611_xtrax-foundations) landed:
- Track I: checkpoint.py rewritten as xtrax.checkpoint.orbax re-export; trainer.py uses save_checkpoint(manager, resumable_state). Composite format is DEAD — no backwards compat.
- Track E: ResumableState adopted; train_step() no longer takes current_step.
- Track D: ast-grep boundary guards in CI; protein-symbols rule scans ../xtrax/src/xtrax.
- Track G: aminx.run.sample/score are now spec-driven with deprecation dispatch shim.
- Track H: use_unified_driver defaults to True.

Three host-dispatch bugs were identified in the original issue and are silent no-ops:
1. STE body was deleted from src/aminx/inference/decode/ste.py — tied-position STE decoding falls through silently.
2. spec.fixed_mask is never read in _prepare_fixed_controls — mask-based fixed positions are a no-op.
3. atom_37/atom_37_mask/chain_mask are never forwarded from LigandContext into build_inference_bundle.

Key file anchors:
- src/aminx/inference/decode/ste.py — STE implementation (currently incomplete/deleted)
- src/aminx/potts/__init__.py — has uncommitted changes (check before editing)
- src/aminx/host/_sampling_helper.py:448 — _prepare_fixed_controls
- src/aminx/host/kernel_dispatch.py:191-215 — build_inference_bundle call sites
- src/aminx/training/checkpoint.py — thin re-export of xtrax.checkpoint.orbax
- src/aminx/training/trainer.py:127-220 — _init_checkpoint_and_model (new load_checkpoint path)
- tests/sampling/test_ste_tied_positions.py — exists; may be skipped or failing
- tests/training/ — new; test_checkpoint.py + test_resumable_state.py (8 tests, all pass)
'''
max_fix_retries = 2
worktree_shadow_mode = false

# ── Track A: STE dispatch restoration ─────────────────────────────────────────
[[tracks]]
id = "a"
is_research = false
worktree = true
skip_worktree = false

[[tracks.items]]
backlog_id = "1767"
phase_name = "Track A — Restore + wire STE dispatch in averaging.py (#1767)"
fixer_prompt = '''
# Track A — Restore STE dispatch (backlog #1767)

## Context
The STE (straight-through estimator) decode path was removed from
src/aminx/inference/decode/ste.py in a prior session. The file currently
has an incomplete or stub body. averaging.py does not dispatch to it.
tests/sampling/test_ste_tied_positions.py exists but may be skipping or failing.

## Step 1 — Recover the implementation
Run:
  git log --all --oneline -- src/aminx/inference/decode/ste.py
to find the last commit that had a working body. Read that version via:
  git show <sha>:src/aminx/inference/decode/ste.py

## Step 2 — Restore ste.py
Restore the STE implementation. It must:
- Implement straight-through estimation for tied-position autoregressive decoding
- Be a pure JAX function compatible with eqx.filter_jit / jax.vmap
- Have no side effects; all randomness via explicit PRNG key

## Step 3 — Wire dispatch in averaging.py
In src/aminx/inference/decode/averaging.py (or equivalent dispatch point),
add the STE branch so it is called when the run spec requests tied-position
STE decoding. Check how other decode modes are dispatched and follow the
same pattern.

## Step 4 — Verify
  uv run pytest tests/sampling/test_ste_tied_positions.py -v
All tests must pass without skips.
Also run: uv run pytest tests/sampling/ -v --tb=short to check no regression.

## Acceptance criteria
- src/aminx/inference/decode/ste.py contains a working non-stub implementation
- averaging.py (or the dispatch module) routes to STE when appropriate
- tests/sampling/test_ste_tied_positions.py: all tests PASS (no skips)
- No regression in tests/sampling/
'''
reviewer_prompt = '''
# Track A Reviewer — STE dispatch (#1767)

VERIFY: src/aminx/inference/decode/ste.py contains a real implementation
  (not just pass, raise NotImplementedError, or an emptied body)
  Check: grep -n "def\|return\|jax\." src/aminx/inference/decode/ste.py | head -20

VERIFY: averaging.py (or the dispatch entry point) imports and calls the STE function
  Check: grep -rn "ste\|STE\|straight_through" src/aminx/inference/ src/aminx/host/

VERIFY: uv run pytest tests/sampling/test_ste_tied_positions.py -v
  All tests PASS. Zero skips.

VERIFY: uv run pytest tests/sampling/ -v --tb=short
  No new failures compared to baseline.

PASS if all VERIFY items are satisfied.
FAIL if ste.py is still a stub, dispatch is missing, or tests skip/fail.
'''
return_key = "1767"

# ── Track B: fixed_mask in _prepare_fixed_controls ────────────────────────────
[[tracks]]
id = "b"
is_research = false
worktree = true
skip_worktree = false

[[tracks.items]]
backlog_id = "1766"
phase_name = "Track B — Read spec.fixed_mask in _prepare_fixed_controls (#1766)"
fixer_prompt = '''
# Track B — fixed_mask gap (_prepare_fixed_controls, backlog #1766)

## Context
src/aminx/host/_sampling_helper.py, function _prepare_fixed_controls (around line 448),
reads spec.fixed_positions to build the fixed-residue tensor but never reads
spec.fixed_mask. RunSpec exposes fixed_mask as a first-class field (a boolean
array of shape [N_residues]) but it is silently ignored — mask-based position
fixing is a complete no-op.

## Task
1. Read src/aminx/host/_sampling_helper.py in full around _prepare_fixed_controls.
2. Read the RunSpec/SamplingSpecification definition to confirm the type and
   semantics of fixed_mask.
3. In _prepare_fixed_controls, after handling fixed_positions, also handle fixed_mask:
   - When spec.fixed_mask is set (not None), treat True positions as fixed.
   - Combine with fixed_positions if both are set (union).
4. Add a test in tests/sampling/test_fixed_positions.py (or new
   tests/sampling/test_fixed_mask.py) that:
   - Creates a spec with fixed_mask set (no fixed_positions)
   - Verifies the output fixed tensor reflects the mask
   - Verifies it differs from an unfixed run

## Acceptance criteria
- _prepare_fixed_controls reads spec.fixed_mask
- When fixed_mask is set, the resulting fixed tensor reflects it
- New test covers the fixed_mask path and passes
- uv run pytest tests/sampling/test_fixed_positions.py -v all pass
'''
reviewer_prompt = '''
# Track B Reviewer — fixed_mask gap (#1766)

VERIFY: grep -n "fixed_mask" src/aminx/host/_sampling_helper.py
  Must show at least one read of spec.fixed_mask inside _prepare_fixed_controls.

VERIFY: A test exercises the fixed_mask path specifically
  Check: grep -rn "fixed_mask" tests/sampling/

VERIFY: uv run pytest tests/sampling/ -v --tb=short
  No failures. New fixed_mask test(s) present and PASS.

PASS if all VERIFY items are satisfied.
FAIL if fixed_mask is still unread, no test was added, or sampling tests regress.
'''
return_key = "1766"

