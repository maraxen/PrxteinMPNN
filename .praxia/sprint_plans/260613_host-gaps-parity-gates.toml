phase_name = "Track D — Training parity gate: checkpoint round-trip + loss curve (G1 #1550)"
fixer_prompt = '''
# Track D — Training parity gate (G1, backlog #1550)

## Context
Track I (prior sprint) rewrote checkpoint.py to use xtrax.checkpoint.orbax
(PyTree format, breaking change from ocp.args.Composite). The new API:
  save_checkpoint(manager, resumable_state)
  load_checkpoint(manager, state_template, step=None)
  get_checkpoint_manager(directory, max_to_keep=N)

8 tests in tests/training/ pass locally. This gate confirms training correctness.

## Task
1. Run full training test suite:
     uv run pytest tests/training/ -v
   Report all results.

2. Run checkpoint round-trip smoke:
     uv run python -c "
     import jax, jax.numpy as jnp, equinox as eqx, tempfile, pathlib
     from xtrax.training.types import ResumableState
     from aminx.training.checkpoint import get_checkpoint_manager, save_checkpoint, load_checkpoint
     key = jax.random.PRNGKey(0)
     model = eqx.nn.Linear(8, 8, key=key)
     state = ResumableState(step=jnp.int32(42), key=key, model=model, opt_state=None, extras={})
     with tempfile.TemporaryDirectory() as d:
         mgr = get_checkpoint_manager(pathlib.Path(d), max_to_keep=1)
         save_checkpoint(mgr, state); mgr.close()
         mgr2 = get_checkpoint_manager(pathlib.Path(d), max_to_keep=1)
         restored = load_checkpoint(mgr2, state); mgr2.close()
         assert int(restored.step) == 42
         print('PARITY GATE: PASS')
     "

3. Write .praxia/docs/research/260613_training-parity-gate.md with results.

## Acceptance criteria
- tests/training/ all pass
- Checkpoint round-trip smoke prints PARITY GATE: PASS
- Research doc created
'''
reviewer_prompt = '''
# Track D Reviewer — Training parity gate (#1550)

VERIFY: uv run pytest tests/training/ -v shows all PASS, zero FAIL.
VERIFY: Research doc exists at .praxia/docs/research/260613_training-parity-gate.md
VERIFY: Doc states checkpoint round-trip smoke PASS.

PASS if all items satisfied.
FAIL if any training test fails or round-trip smoke errors.
'''
return_key = "1550"

