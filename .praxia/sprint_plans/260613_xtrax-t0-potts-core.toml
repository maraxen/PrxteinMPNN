# P-01: PottsMPNN .pt -> potts_<id>.eqx.zst weight recapture script

## Background
The recapture script ports mistypotts/pottsmpnn_ckpt_export.py into a bathos-tracked pipeline.
It loads a PyTorch .pt checkpoint, converts h/J via etab_to_dense_h_j_w (preserving x2 scale),
serializes to .eqx.zst using the PottsCheckpointData pytree, and bakes in k_neighbors metadata.

## Current state
Script is largely complete at scripts/recapture/pottsmpnn_to_eqx.py (487 lines).
Bathos sidecar at scripts/recapture/pottsmpnn_to_eqx.bth.toml.

Key functions expected by tests/potts/test_pottsmpnn_conversion.py:
  - etab_to_dense_h_j_w at line 65: (etab, e_idx, mask) -> (h, J, W)
    * etab shape: (1, L, K, q, q); e_idx shape: (1, L, K)
    * self-loops (e_idx[i,k]==i) go to h diagonal
    * off-diagonal pairs accumulate in J, symmetrize: j = 0.5*(j + j^T)
    * x2 scale: h *= 2.0, j *= 2.0 (directed-slot PottsMPNN convention)
  - extract_k_neighbors_from_config at line 137: reads payload['args']['k_neighbors']
    then payload['hyper_params']['k_neighbors']; raises ValueError "k_neighbors not found" if absent
  - save_checkpoint at line ~286: PottsCheckpointData pytree -> .eqx.zst
    via eqx.tree_serialise_leaves + zstandard compression

PottsCheckpointData (line 44):
  class PottsCheckpointData(eqx.Module):
    h, j, w, mask arrays; k_neighbors: int = eqx.field(static=True)

## What to do
1. Run the conversion tests from /home/marielle/projects/aminx:
     uv run pytest tests/potts/test_pottsmpnn_conversion.py -v --no-header 2>&1 | tail -30

2. If ALL tests PASS: task is complete. Report PASS.

3. If any test FAILS:
   a. Read the failing test to understand the expected contract.
   b. Read scripts/recapture/pottsmpnn_to_eqx.py to find the gap.
   c. Fix the gap in the script.
   d. Re-run `uv run pytest tests/potts/test_pottsmpnn_conversion.py -v`.

## Key test expectations
- test_etab_to_dense_h_j_w_synthetic_2residue: 2-residue ground-truth, tolerance 1e-6
- test_save_potts_checkpoint_format: output starts with zstd magic 0x28 0xb5 0x2f 0xfd
- test_k_neighbors_from_model_config: ValueError raised with "k_neighbors not found" for empty payload

## No external deps needed
All three tests use synthetic data only — no actual .pt checkpoint required.
"""
