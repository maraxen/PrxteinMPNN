# P-09: TRW marginals vs brute-force exact_marginals (backlog #1294)

## Context
PottsModel with DifferentiableTRW is implemented (P-03). This track writes the correctness
gate: for small systems (n<=12 residues), compare TRW marginals against exact brute-force
marginals computed by summing over all q^n configurations.

## What to implement — tests/potts/test_trw_marginals.py

**helper: exact_marginals(h, J, mask, q=4)**
  - Enumerate all q^n valid sequences (n=mask.sum()); use q=4 toy alphabet for tractability
  - Compute unnorm prob: exp(-E(seq)), E = -sum_i h[i,s[i]] - sum_{i<j} J[i,j,s[i],s[j]]
  - Return site marginals p_i(a) = sum_{seq: seq[i]=a} p(seq); shape: Float32[N, q]
  - q=4 gives 4^12=16M configs in ~1s (tractable)

**test_trw_vs_exact_n6_q4**: 6 residues, q=4, random h/J, temperature=1.0
  Call DifferentiableTRW directly (check import: aminx.potts.model or aminx.potts.trw)
  Compare TRW site marginals vs exact_marginals: allclose(atol=0.05, rtol=0.05)

**test_trw_vs_exact_n4_q4_ferromagnet**: 4-residue ferromagnet (J_{ij}=-1 all i!=j, h=0)
  Ground truth: uniform marginals by symmetry. Assert max deviation from uniform < 0.02.

**test_trw_marginals_sum_to_one**:
  allclose(marginals.sum(axis=-1)[mask], 1.0, atol=1e-4)

## Acceptance criteria
- tests/potts/test_trw_marginals.py with 3 tests
- uv run pytest tests/potts/test_trw_marginals.py -v — all 3 pass
- Test runtime < 120s total
'''
