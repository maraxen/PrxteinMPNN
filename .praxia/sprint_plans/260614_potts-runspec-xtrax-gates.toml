# G1 Training parity gate (backlog #1550)

## Context
T1.4 (sprint 260612): trainer.py uses xtrax ResumableState checkpoint (single-PyTree format).
8 tests in tests/training/ pass. G1 is the formal gate confirming training + checkpoint integrity.

## Pass criteria (explicitly defined for this sprint)
1. pytest tests/training/ — all pass, zero fail
2. Checkpoint round-trip: fresh save->close->reopen->load; step==42, all params allclose(atol=1e-7, rtol=0)
3. Loss curve: if loss/convergence tests exist in tests/training/, they must pass.
   If none: run 50-step overfit smoke, assert loss at step 50 < loss at step 0 (>=10% decrease).

## Task

1. uv run pytest tests/training/ -v --tb=short 2>&1 | tail -40

2. Checkpoint round-trip smoke:
   uv run python -c "
import jax, jax.numpy as jnp, equinox as eqx, tempfile, pathlib
from xtrax.training.types import ResumableState
from aminx.training.checkpoint import get_checkpoint_manager, save_checkpoint, load_checkpoint
key = jax.random.PRNGKey(0)
model = eqx.nn.Linear(8, 8, key=key)
state = ResumableState(step=jnp.int32(42), key=key, model=model, opt_state=None, extras={})
with tempfile.TemporaryDirectory() as d:
    mgr = get_checkpoint_manager(pathlib.Path(d), max_to_keep=1)
    save_checkpoint(mgr, state); mgr.close()
    mgr2 = get_checkpoint_manager(pathlib.Path(d), max_to_keep=1)
    restored = load_checkpoint(mgr2, state); mgr2.close()
    assert int(restored.step) == 42
    orig = jax.tree.leaves(eqx.filter(state, eqx.is_array))
    rest = jax.tree.leaves(eqx.filter(restored, eqx.is_array))
    for o, r in zip(orig, rest):
        assert jnp.allclose(o, r, atol=1e-7, rtol=0)
    print('CHECKPOINT ROUND-TRIP: PASS')
" 2>&1

3. uv run pytest tests/training/ -k "loss or curve or overfit or convergence" -v 2>&1
   If no matches: run 50-step overfit check, report step-0 and step-50 loss.

4. Write .praxia/docs/research/260614_g1-training-parity-gate.md with:
