VERIFY: src/aminx/potts/sampling.py exists with gibbs_sweep, parallel_tempering, log_energy
  Check: grep -n "def gibbs_sweep\|def parallel_tempering\|def log_energy" src/aminx/potts/sampling.py

VERIFY: Pure JAX — no Python loops over residues (lax.scan/vmap OK)
