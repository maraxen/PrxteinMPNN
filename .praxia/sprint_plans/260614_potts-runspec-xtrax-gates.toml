fixer_prompt = '''
# P-06: aminx.potts.sampling (backlog #1295)

## Context
PottsModel (P-03) and PottsRunSpec (P-04) are complete. This track implements the sampling
layer: single-sweep Gibbs sampling and parallel tempering, both as pure JAX functions
(no side effects, explicit PRNG keys, jit-compatible).

## What to implement

### src/aminx/potts/sampling.py

**gibbs_sweep(key, seq, h, J, w, mask, temperature=1.0)**
  - Single Gibbs sweep over all positions (or masked subset)
  - For each position i: compute conditional p(a_i | a_{-i}) from (h_i, J_{ij}, w)
  - Sample from categorical; return updated seq
  - Pure JAX: no Python loops over residues; use jax.lax.scan or jax.vmap
  - Types: seq: Int32[N], h: Float32[N, q], J: Float32[N, N, q, q], mask: Bool[N]
  - temperature scales logits before softmax

**parallel_tempering(key, seq, h, J, w, mask, n_replicas=4, temperatures=None, n_sweeps=100)**
  - n_replicas chains at different temperatures (default: linspace(0.5, 2.0, n_replicas))
  - Each sweep: gibbs_sweep all replicas, then propose adjacent swaps (Metropolis-Hastings)
  - Return (final_seqs: Int32[n_replicas, N], energies: Float32[n_replicas])
  - Pure JAX; use jax.lax.scan for outer sweep loop

**log_energy(seq, h, J, w, mask)**
  - Potts energy E(seq) = -sum_i h[i,seq[i]] - sum_{i<j} J[i,j,seq[i],seq[j]]
  - Pure function; Float32 scalar output

Export all three from src/aminx/potts/__init__.py.

## Tests — tests/potts/test_sampling.py
1. test_gibbs_sweep_changes_sequence: correct output shape Int32[N]
2. test_gibbs_sweep_jit_compatible: eqx.filter_jit(gibbs_sweep)(...) does not raise
3. test_log_energy_synthetic: known 2-residue system, allclose(atol=1e-5)
4. test_parallel_tempering_shape: seqs.shape==(n_replicas,N), energies.shape==(n_replicas,)

## Acceptance criteria
- uv run pytest tests/potts/test_sampling.py -v — all 4 tests pass
- uv run ty check src/aminx/potts/sampling.py — exits 0
- gibbs_sweep, parallel_tempering, log_energy exported from aminx.potts
'''
reviewer_prompt = '''
