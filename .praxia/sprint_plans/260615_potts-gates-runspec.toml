# P-06: sampling.py Python loops → jax.vmap (backlog #1295)

## What to change

File: src/aminx/potts/sampling.py
Function: _parallel_tempering_exchange (starts around line 192)
Target lines: 206–224 — the `for parity in range(2)` + `while i + 1 < k_rep` loops

## READ FIRST
Read src/aminx/potts/sampling.py lines 192–245 in full before writing anything.
Also read _attempt_adjacent_swap to understand its exact signature and return shape.

## Current code to replace

```python
for parity in range(2):
    start = parity
    i = start
    while i + 1 < k_rep:
        key_cur, sk = jax.random.split(key_cur)
        seq_cur, key_cur, acc = _attempt_adjacent_swap(
            sk, seq_cur, jnp.int32(i), betas[i], betas[i + 1],
            h, j, w, mask, swap_pair_energy_only=swap_pair_energy_only,
        )
        accept_edge = accept_edge.at[i].set(acc)
        i += 2
```

## Why this is safe to vmap

k_rep = int(seqs.shape[0]) is statically known at trace time.
Within each parity group, swaps are non-overlapping:
  even parity: pairs (0,1), (2,3), (4,5)... — no index shared
  odd parity:  pairs (1,2), (3,4), (5,6)... — no index shared
So vmap over edges within each parity group is correct.

## Replacement approach

Step 1 — Read _attempt_adjacent_swap signature. It takes:
  (key, seqs, i, beta_i, beta_next, h, j, w, mask, swap_pair_energy_only)
  Returns: (updated_seqs, new_key, accept_scalar)
  Note: it takes the FULL seqs array and edge index i (as jnp.int32).

Step 2 — For each parity, build static edge-index arrays:
  even_edges = jnp.arange(0, k_rep - 1, 2)   # shape (n_even,)
  odd_edges  = jnp.arange(1, k_rep - 1, 2)   # shape (n_odd,)

Step 3 — For each parity group, vmap over edges.
  Because _attempt_adjacent_swap reads and writes seqs at positions i and i+1,
  and edges within a parity group are non-overlapping, ALL calls in a group see
  the same input seqs and produce disjoint position updates.
  Strategy:
    - Pre-split n_edges keys: subkeys = jax.random.split(key_cur, n_edges + 1)
      key_cur, subkeys = subkeys[0], subkeys[1:]
    - vmapped call: accepts, new_seqs_per_edge = jax.vmap(swap_fn)(subkeys, edges)
      where swap_fn(sk, edge_i) = _attempt_adjacent_swap(sk, seq_cur, edge_i, ...)
      BUT: _attempt_adjacent_swap returns full updated seqs — scatter only changed pairs.
    - Alternatively: write a scalar helper that extracts just the new pair and accept:
        def _swap_pair(sk, i):
            _, _, acc = _attempt_adjacent_swap(sk, seq_cur, i, betas[i], betas[i+1], ...)
            # Extract new seq values at positions i and i+1 from the returned seqs
            new_seqs, _, acc = _attempt_adjacent_swap(sk, seq_cur, i, betas[i], betas[i+1], ...)
            return new_seqs[i], new_seqs[i+1], acc
      Then scatter: seq_cur = seq_cur.at[even_edges].set(new_i) ...

  IMPORTANT: Check if betas[i] and betas[i+1] can be gathered inside vmap:
    beta_i     = betas[even_edges]      # shape (n_even,)
    beta_next  = betas[even_edges + 1]  # shape (n_even,)
    These can be passed as in_axes=0 to vmap.

Step 4 — Build accept_edge from vmap output directly (no .at[i].set loop).

Step 5 — Keep the two-parity structure (even then odd) as two sequential vmap calls —
  do NOT try to merge parities into one vmap (they must be sequential: odd parity
  uses seqs updated by even parity).

