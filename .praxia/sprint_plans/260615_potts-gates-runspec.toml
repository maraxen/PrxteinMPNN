Key lines: 96–114 (sub-config classes + RunSpec), 218–295 (build_run_spec body).

## Placement: aminx only, NOT xtrax

PlannerTopology is an aminx-specific wrapper around aminx kernel dispatch topology.
- use_unified_driver is a flag for kernel_dispatch.py (aminx-only concept)
- aminx.tiling.BatchPlanner (multi-phase) ≠ xtrax.tiling.BatchPlanner (single-phase)
- Once T2.5 ships (xtrax multi-phase BatchPlanner), PlannerTopology gains an
  xtrax.ExecutionProfile field. For RS-2: one field only.

## File: src/aminx/run/spec.py

### Step 1 — Add PlannerTopology class (after PrecisionConfig, before RunSpec)

```python
class PlannerTopology(eqx.Module):
    """aminx kernel dispatch topology config.

    Wraps aminx.tiling.BatchPlanner config fields for RunSpec.
    Will gain xtrax.ExecutionProfile once xtrax BatchPlanner reaches multi-phase parity (T2.5).
    """
    use_unified_driver: bool = eqx.field(static=True)
```

### Step 2 — Add plan field to RunSpec

Add `plan: PlannerTopology` to the RunSpec class fields.
Order: keep existing fields; append plan after precision.

### Step 3 — Add topology_hash (module-level function, NOT a method)

```python
def topology_hash(plan: PlannerTopology) -> str:
    """Deterministic 16-char hex hash of PlannerTopology for cache-key derivation."""
    import hashlib, json
    payload = {"use_unified_driver": plan.use_unified_driver}
    return hashlib.sha256(json.dumps(payload, sort_keys=True).encode()).hexdigest()[:16]
```

### Step 4 — Update build_run_spec to populate plan

Find the final RunSpec(...) constructor call in build_run_spec. Before it, add:

```python
plan = PlannerTopology(
    use_unified_driver=bool(getattr(spec, "use_unified_driver", True)),
    # Default is True — RS-5 fix in 26c9bb5 confirmed False was wrong
)
```

Pass plan=plan to RunSpec(...).

### Step 5 — Export topology_hash

Check src/aminx/run/__init__.py — add topology_hash to exports if it exports other
spec-level functions (it exports build_run_spec; add topology_hash alongside it).

### Step 6 — Tests

Find or create tests/run/test_run_spec.py. Add:

```python
def test_planner_topology_default():
    from aminx.run.spec import PlannerTopology, topology_hash
    pt = PlannerTopology(use_unified_driver=True)
    assert pt.use_unified_driver is True
    h = topology_hash(pt)
    assert len(h) == 16
    assert h == topology_hash(pt)  # determinism

def test_planner_topology_false():
    from aminx.run.spec import PlannerTopology, topology_hash
    pt_t = PlannerTopology(use_unified_driver=True)
    pt_f = PlannerTopology(use_unified_driver=False)
    assert topology_hash(pt_t) != topology_hash(pt_f)  # different inputs → different hash

