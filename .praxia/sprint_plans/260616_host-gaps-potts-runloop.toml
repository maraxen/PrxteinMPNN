  Line 453: `if sampling_strategy == "straight_through": return _ste_optimize_sequence_legacy(...)`
  But this is only reachable when calling _sample_using_averaged_features_legacy directly,
  not via the split-function path.

## Implementation
- Edit only. Do not Write to existing files.
- Remove `del sampling_strategy` from _make_encoding_sampling_split_fn_legacy (line 362).
  Keep `del decoding_order_fn` only if decoding_order_fn truly is unused.
