fixer_prompt = """
task_id: 260616_host-gaps-potts-runloop
workspace: /home/marielle/projects/aminx

## Objective
Fix the double-application of spec.fixed_mask in `_prepare_fixed_controls` so that a
float-valued shell mask (shape (L,) or (batch, L)) is applied exactly once.

## Key file
src/aminx/host/_sampling_helper.py lines 438-495 (_prepare_fixed_controls)

## Bug
There are TWO blocks handling spec.fixed_mask in this function:
  Block 1 (lines ~448-456): sets fixed_mask_np from spec.fixed_mask via np.broadcast_to
  Block 2 (lines ~485-493): reads spec.fixed_mask AGAIN via _broadcast_per_structure and
    takes jnp.maximum with the already-set fixed_mask_np

This double-application is fragile and inconsistent with the single-pass pattern used for
fixed_positions. The correct single-path logic:
  1. Start with zeros.
  2. If spec.fixed_mask set: apply once via _broadcast_per_structure.
  3. If spec.fixed_positions set: union (jnp.maximum).
  4. If spec.fixed_tokens set: validate against combined mask.

## Implementation
- Edit only. Do not Write to existing files.
- Collapse the two blocks into one, using _broadcast_per_structure at the START of the
  function (before the fixed_positions block), matching the pattern used for fixed_positions.
- Remove Block 2 (lines ~485-493) entirely.
- Add a test in tests/host/test_sampling_helper.py (or nearest existing test file):
  (a) float mask via spec.fixed_mask → correctly broadcast
  (b) fixed_mask + fixed_positions → union taken
  (c) idempotency: applying spec with same mask twice produces same result
- Run `uv run pytest tests/ -x -q 2>&1 | tail -30` before declaring done.

## Constraints
- One file focus: _sampling_helper.py.
- Do not touch kernel_dispatch.py, averaging.py, or Potts code.
"""
