## Objective
Fix the STE path in `_make_encoding_sampling_split_fn_legacy` so that
sampling_strategy="straight_through" reaches `_ste_optimize_sequence_legacy`.

## Key file
src/aminx/host/averaging.py

## Bug
In _make_encoding_sampling_split_fn_legacy (line ~315):
  Line 362: `del sampling_strategy, decoding_order_fn  # Currently only temperature sampling supported`
  This kills sampling_strategy before the returned sample_fn closure can use it.
  Result: regardless of what the caller passes, the split-fn path always runs temperature sampling.

