Research gate findings (from sprint 260620 post-mortem and encoding-aggregation research):

1. AggregationFn, AveragingMode, DecodeFn in specs.py are dead — wrong binary signatures,
   never called from dispatch. The real call site is kernel_dispatch.py:328:
     fused_enc = plan.stage_set.encoding_fusion(stacked_enc)
   which takes a single stacked EncoderOutput (unary — Fuse-shaped).

2. The correct protocols already exist:
   - EncodingFusionFn in aminx/types/stages.py:114 — Fuse[EncoderOutput, EncoderOutput]
   - StageSet.encoding_fusion: EncodingFusionFn | None at stages.py:346 — already wired in dispatch
   - ArithmeticMeanEncodingFusion in averaging.py — reference implementation

3. build_run_spec() (spec.py:311-317) has dead AveragingConfig.average_encoding_mode path;
   spec.encoding_fusion is never read or wired into StageSet.

4. Decode fusion is a NEW step: after _safe_map(_call_decode_one_enc, fused_enc) at
   kernel_dispatch.py:347 and :514, K decode outputs go directly to the transposed sink.
   Inserting a fusion step here enables logit ensembling, best-of-K, etc.

5. DecodeOutput bundle does not exist yet. DecodingFusionFn does not exist yet.

Scope: src/aminx/ only. xtrax unchanged.
"""
