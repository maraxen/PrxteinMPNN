--- THE INSERTION POINT ---

In src/aminx/run/kernel_dispatch.py there are two decode dispatch paths:
  1. Protein path: around line 347 — _safe_map(_call_decode_one_enc, fused_enc, batch_size=None)
  2. Ligand path: around line 514 — similar _safe_map over decode

