  # Apply decode fusion if specified (e.g. logit ensembling, best-of-K)
  if plan.decoding_fusion is not None:
      from aminx.types.bundles import DecodeOutput
      stacked_out = DecodeOutput(sequences=stacked_sequences, logits=stacked_logits)
      fused_out = plan.decoding_fusion(stacked_out)
      stacked_sequences, stacked_logits = fused_out.sequences, fused_out.logits

Where stacked_sequences and stacked_logits are the variable names used at that point.
Read the actual file around those lines to get the exact variable names before editing.

NOTE: "plan" here is the RunSpec (or InferencePlan) object passed into the dispatch
function. Check how it's referenced — it may be `spec`, `run_spec`, or `plan`. Use
whatever variable name holds the RunSpec.

