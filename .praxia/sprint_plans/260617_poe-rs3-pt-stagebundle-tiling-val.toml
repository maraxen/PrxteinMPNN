VERIFY: encoder_sink / decoder_sink expose Optional[Callable] (not tuples) to callers
VERIFY: AC-2 test asserts BOTH sinks fire in order (2-sink side-effect capture)
VERIFY: active_stages() and has_stage(name) work correctly on the adapter
VERIFY: uv run pytest tests/host/ -x -q --tb=short 2>&1 | tail -10 -- all pass including AC-2
VERIFY: uv run ty check 2>&1 | tail -10 -- no new type errors

PASS if all satisfied. FAIL if N-sink multiplicity collapsed, protocol absent, or tests fail.
"""
