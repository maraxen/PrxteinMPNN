phase_name = "Track D -- [xtrax T2.6] aminx StageBundle wrap-adapter preserving N-sink multiplicity (#1555)"
fixer_prompt = """
task_id: 260617_poe-rs3-pt-stagebundle-tiling-val
workspace: /home/marielle/projects/aminx

## Context
xtrax StageBundle (xtrax/stages/bundle.py:22) is a strict eqx.Module with Optional[Callable]
per stage field. aminx StageSet (src/aminx/types/stages.py:266) has tuple[EncoderSinkFn, ...]
at lines 344-345. Build an adapter in aminx that wraps StageSet and presents the xtrax
StageBundle interface without collapsing N sinks into one.

## Key files (read before implementing)
- /home/marielle/projects/xtrax/src/xtrax/stages/bundle.py:22 -- StageBundle (read fully)
- src/aminx/types/stages.py:266 -- StageSet
- src/aminx/types/stages.py:344-345 -- encoder_sink: tuple[...]; decoder_sink: tuple[...]
- src/aminx/host/streaming_host.py -- how sinks fire today (firing order context)

## Design
class StageBundleAdapter(eqx.Module):
  _stage_set: StageSet

  def _chain(self, sinks: tuple) -> Callable | None:
    if not sinks: return None
    def chained(*args, **kwargs):
      for fn in sinks: fn(*args, **kwargs)
    return chained

  @property
  def encoder_sink(self) -> Callable | None:
    return self._chain(self._stage_set.encoder_sink)
  # similarly for decoder_sink, encode_fn, decode_fn
  # active_stages(), has_stage(name) -- inspect which properties are non-None

Create: src/aminx/host/stage_adapter.py

## Test (AC-2): tests/host/test_stage_bundle_adapter.py
- StageSet with 2 encoder sinks (each appends to a shared list for side-effect capture)
- Wrap in StageBundleAdapter
- Call encoder_sink() callable
- Assert BOTH sinks fired AND in order (list has 2 entries in correct sequence)
- Assert active_stages() returns correct names

## Constraints
- Do NOT modify xtrax source. Do NOT modify StageSet.
- uv run pytest tests/host/ -x -q --tb=short 2>&1 | tail -20 before done.
- uv run ty check 2>&1 | tail -20 -- no new type errors.
"""
reviewer_prompt = """
task_id: 260617_poe-rs3-pt-stagebundle-tiling-val
workspace: /home/marielle/projects/aminx

## Checks
