[sprint]
sprint_id = "260618_rs6b-host-migration"
sprint_num = 3
name = "RS-6b: migrate host callers to run_spec.* + ast-grep flat-field lint gate"
description = "Second half of RS-6 (#1625). Migrate ~56 flat spec.<generic-field> reads across 7 host hot-path files to spec.run_spec.<subconfig>.<field> (the canonical post-RS-6a path), add an ast-grep rule banning flat reads in host/*, exempt prep.py. SEMANTICS-PRESERVING only. Backlog #2226 (child of RS-6 #1625 / EPIC #1541). RS-6a (#2225) DONE+merged; RS-7b (#2252) DONE+merged (480b1fa)."
context = """
RS-6b migrates host CALLERS to read generic fields from spec.run_spec.<subconfig>.<field>
(RS-6a already added the sub-configs + build_run_spec wiring). Exemplar (correct pattern,
already in place): src/aminx/host/streaming.py:310 -> spec.run_spec.multistate.n_states.
Migration map: .praxia/docs/plans/260614_runspec-migration-map.md (section 4).
Recon inventory: transduction recon_id 260618_rs6b_inventory.

FIELD -> SUBCONFIG MAP (the ONLY fields to migrate):
  run_spec.sampling: backbone_noise, temperature, num_samples, random_seed, bias,
                     fixed_mask, fixed_positions, fixed_tokens, compute_pseudo_perplexity,
                     return_logits, return_decoding_orders
  run_spec.io:       output_h5_path, cache_path
  run_spec.plan:     use_unified_driver   (kernel_dispatch ~:172; default True both flat and via run_spec -> SAFE/mechanical)

TARGET FILES (migrate every flat read of the above fields; rg is ground truth — line numbers
below are recon-time and may have shifted, esp runner.py post-RS-7b):
  kernel_dispatch.py (~9), streaming.py (~8; :310 already correct), runner.py (~26),
  plan.py (1: num_samples), _sampling_helper.py (9: fixed_*), _sampling_grid_lineage.py (7),
  campaign.py (2), prep.py (1: cache_path ONLY).

SEMANTICS-PRESERVING: run_spec.<sub>.<field> holds the value build_run_spec copied from the
flat spec (with normalization: backbone_noise/temperature -> float tuple, random_seed -> int,
return_* -> bool). Preserve the surrounding expression EXACTLY (e.g. `len(...)`,
`... or (0.0,)`, `... or 42`, `... is not None`, `np.asarray(...)`). No behavior change.

use_unified_driver IS IN SCOPE: kernel_dispatch.py ~:172 reads getattr(spec,'use_unified_driver',True);
run_spec.plan.use_unified_driver also defaults True -> migrating is semantics-preserving. Migrate it to
spec.run_spec.plan.use_unified_driver and ADD it to the ast-grep banned set.

EXPLICITLY OUT OF SCOPE (deferred to follow-ups; do NOT touch):
  - src/aminx/host/_sampling_averaged.py: DEAD (not imported). Do NOT delete (no-auto-delete)
    and do NOT migrate. It is exempt from the gate (or untouched).
  - prep.py: migrate cache_path ONLY; its 21 protein-only flat reads stay flat. prep.py is
    EXEMPT from the ast-grep gate.
"""
max_fix_retries = 1
worktree_shadow_mode = false

[[tracks]]
id = "a"
is_research = false
worktree = true
skip_worktree = false

[[tracks.items]]
backlog_id = "2226"
phase_name = "RS-6b: host caller run_spec.* migration + ast-grep flat-field gate"
return_key = "2226"
fixer_prompt = """
task_id: 260618_autonomous-loop
Edit only (existing host files + new ast-grep rule + new test). SEMANTICS-PRESERVING migration.

STEP 1 — Migrate flat reads in each host file. For EACH target file, use rg to find every flat
read of a migrated field, then replace spec.<field> -> spec.run_spec.<subconfig>.<field> per the
FIELD->SUBCONFIG MAP in the sprint context. Preserve the surrounding expression byte-for-byte
(only the attribute path changes). Files (ground-truth via rg, not fixed counts):
  src/aminx/host/kernel_dispatch.py  (backbone_noise,temperature,bias,compute_pseudo_perplexity,use_unified_driver->run_spec.plan)
  src/aminx/host/streaming.py        (output_h5_path,return_logits,backbone_noise,temperature)
  src/aminx/host/runner.py           (return_logits,return_decoding_orders,random_seed,output_h5_path,backbone_noise)
  src/aminx/host/plan.py             (num_samples)
  src/aminx/host/_sampling_helper.py (fixed_mask,fixed_positions,fixed_tokens)
  src/aminx/host/_sampling_grid_lineage.py (num_samples,random_seed,temperature,backbone_noise)
  src/aminx/host/campaign.py         (temperature,backbone_noise)
  src/aminx/host/prep.py             (cache_path ONLY — leave the 21 protein-only flat reads)
Migrate use_unified_driver (kernel_dispatch:172) -> spec.run_spec.plan.use_unified_driver. DO NOT touch _sampling_averaged.py.
To find sites: `rg -n 'spec[.](backbone_noise|temperature|num_samples|random_seed|bias|fixed_mask|fixed_positions|fixed_tokens|compute_pseudo_perplexity|return_logits|return_decoding_orders|output_h5_path|cache_path|use_unified_driver)' src/aminx/host/`
After migrating, re-run that rg over each file (except prep.py protein lines / use_unified_driver) and confirm ZERO remaining flat reads of the migrated fields.
GATE after STEP 1: `uv run pytest tests/host tests/scoring -q` — ALL pass (semantics preserved, no behavior change). If any test changes value, you broke a wrapped expression — fix it.

STEP 2 — Add the ast-grep gate. Inspect .ast-grep/rules/ (e.g. xtrax-protein-symbols.yml) for the
YAML format + how sgconfig wires rules. Add .ast-grep/rules/rs6b-host-flat-field-ban.yml: a python
rule, severity error, matching `spec.$F` for the migrated field set (NOT use_unified_driver),
scoped to files src/aminx/host/**/*.py with prep.py EXCLUDED, message pointing to the run_spec.* path.
Verify the rule wiring: `ast-grep scan src/aminx/host/` (or the repo's sg invocation) reports ZERO
violations on the migrated code.

STEP 3 — Rule-fires test. Add tests/lint/test_rs6b_flat_field_gate.py (or the repo's convention):
plant a temp file / string with `spec.temperature` in a host-like path and assert ast-grep flags it;
assert the real src/aminx/host/ tree (minus prep.py) is clean. If the repo has no python harness for
ast-grep, write a subprocess-based test invoking the sg binary on a fixture and asserting exit code.

STEP 4 — Full gates:
  uv run pytest tests/host tests/scoring -q   (no regression / no value change)
  ast-grep scan over src/aminx/host/  -> 0 violations (prep.py exempt)
  uv run ty check && uv run ruff check . && uv run ruff format .

STEP 5 — Commit (explicit paths; the worktree gitignores .claude/ but rules are in .ast-grep/):
  git add src/aminx/host/*.py .ast-grep/rules/rs6b-host-flat-field-ban.yml tests/...
  git commit -m "refactor(RS-6b): migrate host callers to run_spec.* + ast-grep flat-field gate (#2226)"
Report: commit SHA, the rg-confirms-zero-remaining output per file, the ast-grep scan result, the
rule-fires test result, and the full gate outputs. State explicitly that no test value changed.
"""
reviewer_prompt = """
task_id: 260618_autonomous-loop
VERIFY checklist for RS-6b (#2226). Run every command; report PASS/FAIL per item with evidence.
1. `uv run pytest tests/host tests/scoring -q` — ALL pass, NO regression. (RS-6b is semantics-preserving;
   any changed test VALUE is a FAIL — a wrapped expression like `len(...)`/`or (0.0,)`/`is not None` got broken.)
2. NO REMAINING FLAT READS: `rg -n 'spec[.](backbone_noise|temperature|num_samples|random_seed|bias|fixed_mask|fixed_positions|fixed_tokens|compute_pseudo_perplexity|return_logits|return_decoding_orders|output_h5_path|cache_path|use_unified_driver)' src/aminx/host/` returns ONLY: prep.py protein-only lines (none of these fields except cache_path which must be migrated) — i.e. zero hits for the migrated fields in kernel_dispatch/streaming/runner/plan/_sampling_helper/_sampling_grid_lineage/campaign, and prep.py cache_path migrated. Any stray flat read = FAIL.
3. AST-GREP GATE: .ast-grep/rules/rs6b-host-flat-field-ban.yml exists, scoped to src/aminx/host/**/*.py with prep.py excluded, bans the migrated field set (NOT use_unified_driver). `ast-grep scan src/aminx/host/` reports 0 violations.
4. RULE FIRES: the new test plants a `spec.temperature` host-path violation and asserts ast-grep flags it (the gate actually works, not a no-op). Test PASSES.
5. OUT-OF-SCOPE UNTOUCHED: `git show --stat HEAD` shows NO changes to _sampling_averaged.py; prep.py's 21 protein-only reads unchanged. use_unified_driver IS migrated (kernel_dispatch -> run_spec.plan) and IS in the banned set.
6. uv run ty check clean; uv run ruff check . clean; uv run ruff format . no diff.
7. SCOPE: HEAD touches only src/aminx/host/*.py, .ast-grep/rules/rs6b-host-flat-field-ban.yml, and the new test. No unrelated files.
PASS only if all 7 hold. Else FAIL with the specific item.
"""

[orchestration]
sequential = ["a"]
concurrent = []
