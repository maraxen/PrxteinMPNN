   (no duplicated log_softmax/masked-sum formula). score_from_encoding/encode exist in score_conditional.py
   and kernel() composes them (existing non-averaged behaviour byte-identical).
6. NO STATIC-D RECOMPILE: D is not a static jit arg; D bundles built in host Python (risk R2). Conditioning
   fields asserted identical across the D bundles (risk R3).
7. uv run ty check clean; uv run ruff check . clean; uv run ruff format . no diff.
8. SCOPE: git show --stat HEAD touches only score_conditional.py, scoring/score.py, host/runner.py,
   run/specs.py (docstring), and tests/scoring/test_averaged_parity.py (+ golden). No unrelated files.
PASS only if all hold (item 2 satisfied by either the full path OR the documented off-ramp). Else FAIL with the specific item.
