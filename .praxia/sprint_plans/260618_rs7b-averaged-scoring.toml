   identity test asserting averaged-path logits AND nll equal the non-averaged score() bit-for-bit
   (jnp.array_equal, or atol=0/rtol<=1e-7 with a justification comment). It PASSES.
   [If the OFF-RAMP was taken instead: verify score()/runner raises NotImplementedError for averaged mode
