[sprint]
sprint_id = "260618_runspec-hygiene-p1"
sprint_num = 1
name = "260618_runspec-hygiene-p1"
description = "RunSpecification hygiene: move conditioning fields to base, fix chain_mask hardcode, fix _sync_run_spec double-fire, promote Fuse/Tap/Sink/AxisBoundary to xtrax"
context = """
Spec: .praxia/docs/specs/260615_runspec-xtrax-run-epic.md (Sprint 260618 section)
Key facts:
- RunSpecification is a plain @dataclass (frozen=True) — NOT eqx.Module
- build_run_spec reads all fields via getattr(...) — MRO-agnostic
- aminx/src/aminx/run/specs.py: RunSpecification base (line 109), SamplingSpecification (line ~330)
- aminx/src/aminx/host/_sampling_helper.py: chain_mask hardcode at line 346; _broadcast_per_structure at lines 448-457
- aminx/src/aminx/types/boundaries.py: source for Fuse/Tap/Sink/AxisBoundary (to be promoted)
- xtrax/src/xtrax/stages/protocols.py:39: FuseFn (to become deprecated alias for Fuse)
- pyproject.toml:142: ruff banned-api rule TID251 for xtrax.stages.protocols deep imports
"""
max_fix_retries = 2
worktree_shadow_mode = false

[[tracks]]
id = "a"
is_research = false
worktree = false
skip_worktree = false

[[tracks.items]]
backlog_id = "1920"
phase_name = "Track A — H1: Move sidechain_conditioning + fixed_mask to RunSpecification base (#1920)"
fixer_prompt = """
Fix #1920: Move sidechain_conditioning + fixed_mask from SamplingSpecification to RunSpecification base.

FILE: aminx/src/aminx/run/specs.py

STEP 1 — Remove from SamplingSpecification:
Find the SamplingSpecification class. Remove these two fields:
  fixed_mask: ArrayLike | None = None          # currently around line 316
  sidechain_conditioning: bool = False         # currently around line 336

STEP 2 — Add to RunSpecification base:
Find the RunSpecification defaulted-field block (lines 145-225). Add BEFORE the line
`run_spec = field(init=False, repr=False)` (around line 226):

  # Conditioning — available to all subclasses (not just Sampling)
  sidechain_conditioning: bool = False
  fixed_mask: ArrayLike | None = None

SAFETY: build_run_spec at aminx/src/aminx/run/spec.py reads these via getattr(..., "sidechain_conditioning", False)
and getattr(..., "fixed_mask", None) — MRO-agnostic, so moving the field is safe.
spec_json.py:186 already includes fixed_mask in the array-coercion set — no change needed there.

STEP 3 — Add tests:
- Round-trip test: construct ScoringSpecification(fixed_mask=jnp.ones((1, 8))), assert field survives JSON round-trip
- Base test: assert hasattr(RunSpecification(), 'sidechain_conditioning') and hasattr(RunSpecification(), 'fixed_mask')
- Inheritance test: assert hasattr(InspectionSpecification(), 'sidechain_conditioning') — verifies ALL subclasses inherit it

Run: uv run pytest
"""
reviewer_prompt = """
Review H1: Move sidechain_conditioning + fixed_mask to RunSpecification base.

VERIFY 1: uv run pytest passes (no failures)
VERIFY 2: grep 'sidechain_conditioning' aminx/src/aminx/run/specs.py — field appears ONCE in RunSpecification, NOT in SamplingSpecification
VERIFY 3: grep 'fixed_mask' aminx/src/aminx/run/specs.py — field appears ONCE in RunSpecification, NOT in SamplingSpecification
VERIFY 4: A test exists that asserts InspectionSpecification() has sidechain_conditioning (confirms inheritance, not just SamplingSpec)
VERIFY 5: ScoringSpecification round-trip test for fixed_mask exists and passes

PASS if all 5 VERIFY items are satisfied.
FAIL if any VERIFY item is not met or untestable as written.
"""
return_key = "1920"

[[tracks]]
id = "b"
is_research = false
worktree = false
skip_worktree = false

[[tracks.items]]
backlog_id = "1921"
phase_name = "Track B — H2: Fix chain_mask hardcode in _sampling_helper.py:346 (#1921)"
fixer_prompt = """
Fix #1921: Replace chain_mask hardcode with fixed_mask-aware logic.

PREREQUISITE: H1 (#1920) must be complete — spec.fixed_mask is now on RunSpecification base.

FILE: aminx/src/aminx/host/_sampling_helper.py

TARGET LINE ~346:
  chain_mask = jnp.ones((batch_size, seq_len), dtype=jnp.float32)

There is a comment at line ~343-345 explaining this is a placeholder ("In the future, spec could have chain_mask...").
Remove the comment and replace the line with:

  if spec.fixed_mask is not None:
      fixed_mask_np = _broadcast_per_structure(
          spec.fixed_mask, batch_size=batch_size, expected_len=seq_len,
          dtype=jnp.float32, name="fixed_mask"
      )
      chain_mask = 1.0 - fixed_mask_np  # _broadcast_per_structure guarantees float32
  else:
      chain_mask = jnp.ones((batch_size, seq_len), dtype=jnp.float32)

IMPORTANT:
- Do NOT write `1 - spec.fixed_mask` directly — raw user input, possibly 1-D and unpadded
- _broadcast_per_structure signature: (value, batch_size=, expected_len=, dtype=, name=)
  It exists at lines 448-457 in _prepare_fixed_controls — use the keyword form, not positional
- Convention: chain_mask uses 1=designable 0=fixed; fixed_mask uses 1=fixed — hence complement

Add tests:
  def test_chain_mask_fixed_mask_none():
      result = <chain_mask when spec.fixed_mask is None>
      assert result.shape == (batch_size, seq_len)
      assert result.dtype == jnp.float32
      assert jnp.all(result == 1.0)

  def test_chain_mask_fixed_mask_set():
      fixed = jnp.ones((1, 8))
      result = <chain_mask with fixed_mask=fixed, seq_len=8>
      assert jnp.all(result == 0.0)
      assert result.dtype == jnp.float32

Run: uv run pytest
"""
reviewer_prompt = """
Review H2: chain_mask hardcode fix.

VERIFY 1: uv run pytest passes
VERIFY 2: fixed_mask=None branch produces chain_mask = jnp.ones((batch_size, seq_len), dtype=float32)
VERIFY 3: fixed_mask set branch produces the complement (1.0 - fixed_mask_np)
VERIFY 4: chain_mask.dtype == jnp.float32 asserted in tests for both branches
VERIFY 5: _broadcast_per_structure called with keyword args (batch_size=, expected_len=, dtype=jnp.float32, name=)
VERIFY 6: raw spec.fixed_mask never used directly in arithmetic — always through _broadcast_per_structure

PASS if all 6 VERIFY items are satisfied.
FAIL if any VERIFY item is not met or untestable as written.
"""
return_key = "1921"

