[[tracks.items]]
backlog_id = "1907"
phase_name = "Track C — H4a: Promote Fuse/Tap/Sink/AxisBoundary to xtrax/stages/boundaries.py (#1907)"
fixer_prompt = """
Fix #1907: Create xtrax/stages/boundaries.py as the canonical definition and deprecate FuseFn.

STEP 1 — Create xtrax/src/xtrax/stages/boundaries.py:
Copy the exact protocol signatures from aminx/src/aminx/types/boundaries.py (do NOT modify them):

  from __future__ import annotations
  from typing import Generic, Protocol, TypeVar, runtime_checkable
  import equinox as eqx

  S = TypeVar("S")
  O = TypeVar("O")
  T = TypeVar("T")

  @runtime_checkable
  class Fuse(Protocol, Generic[S, O]):
      def __call__(self, stacked: S) -> O: ...

  @runtime_checkable
  class Tap(Protocol, Generic[T]):
      ordered: bool
      def __call__(self, x: T) -> T: ...

  @runtime_checkable
  class Sink(Protocol, Generic[T]):
      ordered: bool
      def __call__(self, x: T) -> None: ...

  class AxisBoundary(eqx.Module):
      fuse: Fuse | None = eqx.field(static=True, default=None)
      tap: Tap | None = eqx.field(static=True, default=None)
      sink: Sink | None = eqx.field(static=True, default=None)

STEP 2 — Update xtrax/src/xtrax/stages/__init__.py:
Add: from xtrax.stages.boundaries import Fuse, Tap, Sink, AxisBoundary
Add to __all__: "Fuse", "Tap", "Sink", "AxisBoundary"

STEP 3 — Deprecate FuseFn in xtrax/src/xtrax/stages/protocols.py:
- REMOVE the FuseFn class definition from protocols.py
- Any TypeAliases in protocols.py that referenced FuseFn (e.g. LogitTransformFn) — check if they exist;
  if so, update them to reference Fuse from xtrax.stages.boundaries instead
- Add module-level __getattr__ at the END of protocols.py:

  import warnings as _warnings
  def __getattr__(name: str):
      if name == "FuseFn":
          _warnings.warn(
              "FuseFn is deprecated; import Fuse from xtrax.stages.boundaries instead.",
              DeprecationWarning,
              stacklevel=2,
          )
          from xtrax.stages.boundaries import Fuse
          return Fuse
      raise AttributeError(name)

SCOPE NOTE: aminx/src/aminx/types/stages.py:68 has a SEPARATE FuseFn (logit transform protocol
with bias parameter). Do NOT touch that file.

Run: uv run pytest in xtrax. Run: uv run pytest in aminx.
"""
reviewer_prompt = """
Review H4a: Promote Fuse/Tap/Sink/AxisBoundary to xtrax.

VERIFY 1: xtrax tests pass — uv run pytest (from xtrax root)
VERIFY 2: aminx tests pass — uv run pytest (from aminx root)
VERIFY 3: from xtrax.stages import Fuse, Tap, Sink, AxisBoundary — all four resolve without ImportError
VERIFY 4: isinstance check — a class with def __call__(self, stacked): ... passes isinstance(obj, Fuse)
VERIFY 5: AxisBoundary() with all-None fields constructs; eqx.tree_flatten(ab) succeeds
VERIFY 6: from xtrax.stages.protocols import FuseFn  # noqa: TID251 raises DeprecationWarning
VERIFY 7: aminx/src/aminx/types/stages.py is UNCHANGED (logit-transform FuseFn out of scope)
VERIFY 8: from aminx.types.boundaries import Fuse still resolves (aminx shim not yet changed — next track)

PASS if all 8 VERIFY items are satisfied.
FAIL if any VERIFY item is not met or untestable as written.
"""
return_key = "1907"

