[[tracks.items]]
backlog_id = "1905"
phase_name = "Track A-2 -- Add chain_mask_fixed to SamplingSpecification (#1881)"
fixer_prompt = """
Fix #1881: add `chain_mask_fixed: ArrayLike | None = None` to `SamplingSpecification`
and wire it as a direct-override priority in `_sampling_helper.py`.

WORKING DIRECTORY: /home/marielle/projects/aminx

Prerequisites: Track A-1 (#1904) must be committed first.

STEP 1 -- Add field to SamplingSpecification:
  File: src/aminx/run/specs.py, around line 476 (after `dedup_specs` field).
  Add:
    chain_mask_fixed: ArrayLike | None = None

  `ArrayLike` is already imported in the file.

STEP 2 -- Wire in _sampling_helper.py:
  File: src/aminx/host/_sampling_helper.py, lines 343-365.
  Current chain_mask computation block:
    if spec.fixed_mask is not None:
        fixed_mask_np = _broadcast_per_structure(...)
        chain_mask = 1.0 - fixed_mask_np
        assert chain_mask.dtype == jnp.float32
    else:
        chain_mask = jnp.ones((batch_size, seq_len), dtype=jnp.float32)

  Prepend a new guard that fires FIRST:
    if getattr(spec, "chain_mask_fixed", None) is not None:
        chain_mask = _broadcast_per_structure(
            spec.chain_mask_fixed, batch_size=batch_size, expected_len=seq_len,
            dtype=jnp.float32, name="chain_mask_fixed",
        )
        assert chain_mask.dtype == jnp.float32
    elif spec.fixed_mask is not None:
        (existing logic unchanged)
    else:
        chain_mask = jnp.ones((batch_size, seq_len), dtype=jnp.float32)

  Priority order: chain_mask_fixed > fixed_mask complement > all-ones fallback.

ACCEPTANCE:
1. `SamplingSpecification(inputs=..., chain_mask_fixed=None)` round-trips.
2. When `chain_mask_fixed` is set, _sampling_helper uses it verbatim (not derived).
3. When `chain_mask_fixed=None` and `fixed_mask` set, complement derivation unchanged.
4. When both None, all-ones fallback unchanged.
5. `uv run pytest tests/ -q --ignore=tests/parity` clean.

COMMIT:
  git add src/aminx/run/specs.py src/aminx/host/_sampling_helper.py
  git commit -m "feat(#1881): add chain_mask_fixed to SamplingSpecification; wire in _sampling_helper"

When done, end with: verdict: done
"""
reviewer_prompt = """
Review #1881: chain_mask_fixed field + _sampling_helper wiring.

VERIFY 1: grep -n "chain_mask_fixed" src/aminx/run/specs.py -- appears in SamplingSpecification.
VERIFY 2: grep -n "chain_mask_fixed" src/aminx/host/_sampling_helper.py -- appears before
  the fixed_mask elif block (priority guard fires first).
VERIFY 3: Fallback path (chain_mask_fixed=None, fixed_mask=None) produces all-ones float32.
VERIFY 4: `uv run pytest tests/ -q --ignore=tests/parity` -- no regressions.

PASS if all 4 satisfied. FAIL if chain_mask_fixed not wired or fallback broken.
"""
return_key = "1905"

