2. runner.py inspect() path passes `fixed_mask` from spec to `build_inference_bundle`.
3. `uv run pytest tests/ -q --ignore=tests/parity` clean.

COMMIT:
  git add src/aminx/host/runner.py
  git commit -m "fix(#1880): thread fixed_mask into inspection runner path"

When done, end with: verdict: done
"""
