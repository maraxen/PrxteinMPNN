[sprint]
sprint_id = "260618_runspec-xtrax-run"
sprint_num = 1
name = "260618_runspec-xtrax-run"
description = "P1 sprint: wire fixed_mask through inspection path, add chain_mask_fixed, verify _sync_run_spec guard."
context = """
Recon findings (2026-06-16):

1. FIELD LOCATIONS -- `fixed_mask: ArrayLike | None = None` (line 268) and
   `sidechain_conditioning: bool = False` (line 269) are declared on BASE class
   `RunSpecification` (src/aminx/run/specs.py:147). ALL subclasses, including
   `InspectionSpecification` (line 580), already inherit them -- the fields are
   NOT missing. But `runner.py` inspect() path (lines 548-559) does NOT pass
   `spec.fixed_mask` or `spec.sidechain_conditioning` into `build_inference_bundle`.
   They are silently ignored in the inspection code path. #1904 = fix wiring, not add fields.

2. CHAIN_MASK WIRING -- `src/aminx/host/_sampling_helper.py:343-365` computes
   chain_mask from `spec.fixed_mask` (complement) or all-ones fallback.
   `build_inference_bundle` at `src/aminx/inference/bundle_builder.py:47` accepts
   `chain_mask: jax.Array | None = None` but runner.py does not pass it.
   `chain_mask_fixed` (#1905) is a NEW field that bypasses the derivation entirely.

3. DOUBLE-FIRE -- Already fixed. `RunSpecification._sync_run_spec()` at specs.py:272-278
   checks `self._run_spec_synced` before firing. Guard committed in e0791e4 (on main).
   Item #1906 is verify-only -- no implementation needed.
"""
