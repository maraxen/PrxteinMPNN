  from __future__ import annotations
  from typing import Any
  import equinox as eqx
  from xtrax.stages.boundaries import AxisBoundary
  from xtrax.tiling import AxisSpec

  class RunSpec(eqx.Module):
      \"\"\"Base execution config. aminx.run.RunSpec (eqx.Module) extends this.\"\"\"
      seed: int
      axes: list[AxisSpec]
      carry_specs: dict[str, Any] = eqx.field(default_factory=dict)
      boundaries: list[AxisBoundary] | None = None

FILE: xtrax/src/xtrax/run/resolver.py
Content:
  from __future__ import annotations
  from dataclasses import dataclass
  from typing import Any, NewType
  from typing import Protocol, runtime_checkable
  import equinox as eqx
  from xtrax.run.spec import RunSpec

  FeatureBatch = NewType("FeatureBatch", dict)

  @dataclass
  class RuntimeBundle:
      \"\"\"Materialized execution context (produced before InputResolver fires).\"\"\"
      iterator: Any
      model: eqx.Module

  @runtime_checkable
  class InputResolver(Protocol):
      \"\"\"Map (spec, materialized bundle) to a feature batch.

      Do NOT make this a generic Protocol[S, T] over two TypeVars.
      Use @functools.singledispatch for subclass-specific implementations.
      \"\"\"
      def __call__(self, spec: RunSpec, bundle: RuntimeBundle) -> FeatureBatch: ...

FILE: xtrax/src/xtrax/run/sink.py
Content:
  from __future__ import annotations
  from dataclasses import dataclass, field
  from pathlib import Path
  from typing import Literal

  @dataclass
  class SinkSpec:
      \"\"\"Routing config for output sinks.\"\"\"
      output_dir: Path | None = None
      format: Literal["jsonl", "h5", "none"] = "jsonl"
      flush_every: int = 1

FILE: xtrax/src/xtrax/run/protocols.py
