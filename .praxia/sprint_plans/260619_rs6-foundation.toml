Based on the canonical decisions above, Track A (R6-1) MUST use these constructor kwarg names when creating xtrax/run/spec.py and any AxisSpec instantiation:
- `default_batch_size=` (canonical, replaces batch_size=)
- `tile_granularity=` (canonical, replaces granularity=)

