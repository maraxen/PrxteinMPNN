- xtrax uses granularity (short)
- prolix uses tile_granularity (domain-specific; Pallas/safe_map alignment context)
- Recommendation: use tile_granularity — disambiguates from other granularity concepts (bucket granularity, sequence granularity)
- Choose and commit. Do not write "TBD" or "deferred".

