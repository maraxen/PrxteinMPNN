VERIFY 1: xtrax/src/xtrax/tiling/plan.py — AxisSpec has default_batch_size: int and tile_granularity: int = 1 (NOT batch_size or granularity)
VERIFY 2: AxisSpec has __getattr__ method that returns default_batch_size for "batch_size" and tile_granularity for "granularity" with DeprecationWarning
VERIFY 3: AxisDecision.batch_size is UNCHANGED — still named batch_size (it is the output field, not the input hint)
VERIFY 4: All plan.py internal accesses use spec.default_batch_size (grep -n "spec\\.batch_size" src/xtrax/tiling/plan.py should return 0 hits for AxisSpec accesses)
VERIFY 5: All tests use AxisSpec(..., default_batch_size=...) — no remaining batch_size= kwargs in AxisSpec constructions in test files
VERIFY 6: cd /home/marielle/projects/xtrax && uv run pytest — full suite passes
VERIFY 7: cd /home/marielle/projects/aminx && uv run pytest — full suite passes
