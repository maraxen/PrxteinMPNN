  assert len(w) == 1 and issubclass(w[0].category, DeprecationWarning) and val == 8
  print('OK')
  "

PASS if all 8 satisfied.
FAIL if batch_size or granularity remain as first-class AxisSpec fields, or if AxisDecision.batch_size was renamed.
