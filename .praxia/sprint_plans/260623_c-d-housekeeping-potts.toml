fixer_prompt = """
# DRAFT — requires human review before dw emit-sprint

BACKLOG DESCRIPTION:
PoeModel already supports Product-of-Experts energy summation over K backbones. Missing for full Caliby-style inference (Shuai et al. 2025): (1) DLMC (discrete Langevin Monte Carlo) sampler as an alternative to Gibbs sweeps in MpnnPottsDesigner, (2) LCP (local consistency projection) regularizer on the Potts energies. Reference: Caliby Fig 2 benchmark uses DLMC+LCP vs our current Gibbs+TRW. Both live in aminx.potts.sampling and aminx.potts.runner respectively. Prerequisite: converted PottsMPNN weights in outputs/weights/pottsmpnn/ (job 15771565).

