fixer_prompt = """
# DRAFT — requires human review before dw emit-sprint

BACKLOG DESCRIPTION:
Implement MpnnPottsDesigner(eqx.Module) holding an Aminx (MPNN) instance and a PottsModel instance. run_design(key, coords, mask, ...) runs: (1) Aminx forward pass to get per-position logits (q=21), (2) apply static alphabet_map permutation (from P-10 decision) to align logit indices to Potts state indices, (3) seed Gibbs initial sequence from MPNN per-position marginals (using gumbel sampling or argmax — seeding mode must be a static PottsRunSpec field), (4) run aminx.potts.sampling Gibbs/PT chain from seeded state. Seeding semantics decision (from P-10): whether to use unconditional per-position logits or order-averaged estimate — this must be recorded as an explicit decision in the spec before implementation begins. Alphabet_map is a static field (Int array, load-time assertion on idx20 semantics). Both Aminx and PottsModel weights are loaded independently and held as separate pytrees. Advisory note: MPNN logits from a single AR pass carry decoding-order bias; unconditional per-position logits are preferred for seeding unless a specific AR ordering is required.

