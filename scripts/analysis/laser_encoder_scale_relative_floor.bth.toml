[metadata]
title = "laser_encoder float32 SCALE-RELATIVE parity floor (option 3, chosen by the user 261013 for laser_encoder)"
created = "261013"
schema_version = "0.3"

[experiment]
hypothesis = """
PRE-REGISTERED BEFORE ANY RUN OF THIS SCRIPT, AND BEFORE THE SCRIPT EXISTS. Nothing below was
written after seeing a result from it.

DECISION BEING SERVED. On 261013 the user chose option 2 of the f32-tier options put to them,
which is the laser_score option 3 of .praxia/docs/decisions/261003_laser-score-tier3-f32-design.md:
replace the element-wise f32 assertion with a per-(pair, field) SCALE-RELATIVE one,
max|aminx - upstream| <= tol * max|ref|, with tol MEASURED by a pre-registered floor run. For
laser_score that run was 3af3be02 (proposed_tol 4e-4). This sidecar is the same measurement for
laser_encoder.

WHY laser_encoder NEEDS IT. Graded run 91dfbf20 (laser_encoder_f32_floor.py @ 6b9ba574) graded
noise_reaches_defect_scale under the ELEMENT-WISE rule: proposed_atol 4e-3 sits at 0.246 of an
injected 1e-2 relative defect, not the required 10x below it, and the binding term is atol
(binding_atol_share 0.58). f64 passes (63/63 in gate run 466053e2 at bf1d7b21). Attribution run
e993b929 graded larger_than_upstream_rounding on ONE of 378 entries (worst ratio 2.26 on
lig_pr_eattr, soluble_65000__1a3u_1; median ratio 0.62) -- that run's numbers are NOT used to
derive anything here, for the same reason 3af3be02 did not reuse 18b97f4f's.

HYPOTHESIS. A band derived as ceil_one_significant_figure(10 * floor), where floor is the maximum
over (pair, field) of max|aminx - upstream| / max|ref| in float32, (a) admits every held-out pair
when derived from the other 62, and (b) rejects an injected 1e-2 relative defect while staying at
least 10x below its scale-relative size, with no degenerate (pair, field) scale.

I DO NOT PREDICT THE OUTCOME. laser_encoder's earliest field (lig_scalars) is where laser_score's
shared f32 error was largest, and some fixtures may carry near-zero-scale fields; either can fire a
non-pass outcome below, and a non-pass is a real result to report, not to work around.

INSTRUMENT. Identical to 3af3be02's: this script imports laser_score_scale_relative_floor.py and
laser_f32_tolerance_floor.py UNCHANGED (their bytes and hashes do not move) and only points the
wave at laser_encoder. Every threshold, the derivation rule, the degenerate threshold, the control
size and the margin are inherited exactly; none is chosen here.
"""
stage_name = "diagnosis"
novel = false

[outcomes.pass]
condition = "self_test_passed AND f64_passes AND f32_violated_elementwise AND loo_all_admitted AND control_rejected AND below_control_scale AND degenerate_fields == []"
decision = "Report proposed_tol to the user for ratification, then amend tests/port/targets/laser_encoder.toml (tolerance_policy_f32 = 'scale_rel=<proposed_tol>') and change tests/port/test_laser_encoder.py's tier-3 assertion to the scale-relative FORM laser_score already uses, teaching tests/lint/test_port_tolerances_match_targets.py the form in the same change if it does not already accept it. The f64 tier is not touched."
reasoning = "Same as 3af3be02: leave-one-out admission makes this a floor rather than a fit, and rejecting a 1e-2 defect at a 10x margin shows the rule change kept the assertion's teeth."
is_residual = false
adversarial_check = "NOT (self_test_passed AND f64_passes AND f32_violated_elementwise AND loo_all_admitted AND control_rejected AND below_control_scale AND degenerate_fields == [])"

[outcomes.defect_not_tolerance]
condition = "self_test_passed AND NOT f64_passes"
decision = "Do NOT touch any tolerance and do NOT report a band. Escalate: the f64 tier is failing, so the port disagrees with upstream for a reason float32 does not explain."
reasoning = "f64 is re-measured in this tree rather than inherited from the gate run, so a real defect cannot be laundered into a rule change."
is_residual = true
adversarial_check = "NOT self_test_passed OR f64_passes"

[outcomes.elementwise_was_fine]
condition = "self_test_passed AND f64_passes AND NOT f32_violated_elementwise"
decision = "Do NOT change the rule. The element-wise band is not violated in this tree, which contradicts gate run 466053e2; go read that run's outcomes file."
reasoning = "The premise (63/63 tier-3 failures in 466053e2 at bf1d7b21) is re-checked here rather than assumed."
is_residual = true
adversarial_check = "NOT self_test_passed OR NOT f64_passes OR f32_violated_elementwise"

[outcomes.noise_reaches_defect_scale]
condition = "self_test_passed AND f64_passes AND f32_violated_elementwise AND NOT below_control_scale"
decision = "Escalate to the user. Do NOT adopt the scale-relative rule: if its floor is also within 10x of a 1e-2 defect, no band of either form separates float32 noise from a 1% defect on this wave."
reasoning = "Stops the rule change from being a dressed-up widening."
is_residual = true
adversarial_check = "NOT self_test_passed OR NOT f64_passes OR NOT f32_violated_elementwise OR below_control_scale"

[outcomes.scale_is_degenerate]
condition = "self_test_passed AND f64_passes AND degenerate_fields != []"
decision = "Do NOT adopt the rule for the degenerate fields; report them by name to the user. A field whose max|ref| over a pair is at or near zero has no scale to be relative to."
reasoning = "The scale-relative rule's own failure mode, declared in advance. Degenerate: max|ref| <= 1e-6 of the largest field scale in that pair (inherited threshold)."
is_residual = true
adversarial_check = "NOT self_test_passed OR NOT f64_passes OR degenerate_fields == []"

[outcomes.band_does_not_generalise]
condition = "self_test_passed AND f64_passes AND f32_violated_elementwise AND below_control_scale AND NOT loo_all_admitted"
decision = "Do NOT adopt the measured band. One pair's maximum does not characterise the population."
reasoning = "Leave-one-out is the admission that can fail; plain all_admitted is true by construction under this rule and is not a criterion."
is_residual = true
adversarial_check = "NOT self_test_passed OR NOT f64_passes OR NOT f32_violated_elementwise OR NOT below_control_scale OR loo_all_admitted"

[outcomes.instrument_unverified]
condition = "NOT self_test_passed"
decision = "Discard every number from this run. Fix the instrument and re-run."
reasoning = "The inherited self-test includes negative controls on the derivation and on the grader; if any fails the instrument is not known to be able to refuse."
is_residual = true
adversarial_check = "self_test_passed"

[outcomes.oracle_absent]
condition = "self_test_passed AND oracle_absent != []"
decision = "No conclusion. Re-run with AMINX_LASER_ORACLE_DIR pointing at the sealed b3_laser_owned dumps."
reasoning = "Dump absence is an environment fact (as gate run c8abb893 showed for this wave), never a measurement."
is_residual = true
adversarial_check = "NOT self_test_passed OR oracle_absent == []"

[outcomes.fail]
condition = "self_test_passed AND f64_passes AND f32_violated_elementwise AND below_control_scale AND loo_all_admitted AND degenerate_fields == [] AND NOT control_rejected"
decision = "Do not adopt the band. The derivation produced a band that admits the injected defect."
reasoning = "Admission arithmetic and margin arithmetic disagree: an instrument fault surfacing as a result. Report it."
is_residual = true
adversarial_check = "NOT self_test_passed OR NOT f64_passes OR NOT f32_violated_elementwise OR NOT below_control_scale OR NOT loo_all_admitted OR degenerate_fields != [] OR control_rejected"

