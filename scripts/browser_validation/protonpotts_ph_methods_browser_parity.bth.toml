onnxruntime_web_version = "str"
chromium_version = "str"
git_hash = "str"
git_clean = "bool"
seed_offset = "int"
n_cases = "int"
n_pass = "int"
n_fragile_designs = "int"
max_prob_discrepancy = "float"
cases = "list"
