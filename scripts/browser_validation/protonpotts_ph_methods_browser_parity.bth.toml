control_tokens_detected = "bool"
control_randint_detected = "bool"
control_perm_detected = "bool"
control_energy_detected = "bool"
error = "str"

[dependencies]
aminx_version = { type = "git_sha", required = true }

[data]
checkpoint = "ProtonPottsMPNN v6 epoch-0125, sha256 a39872250c0b8eb4c0b4cb6472a6edad0d6f6134a50c28b611386e83c592fe7b"
artifacts = "X6a 40b4318e (scoring 7b2087dc...9243), X7a d5918c26 (ph 131a65cb...6fe7319)"
tolerances = "X11b's, unchanged: tokens/pins/n_draws exact; energies <= 1e-4 rel; PROB_BOUND 5e-3; explained-divergence and TIE_MARGIN 2.5e-4 exemptions (fragile, reported); held-out seed offset 300000"

[provenance]
note = "Pre-registered at the commit that adds this file, before the harness page and protonpotts_ph_methods_browser_parity.py exist and before any browser output of these methods exists. X11b (Node) passed as 98067055; X10's site gate exercised the deployed page, not these methods' outputs against the reference."
