[metadata]
title = "X11b Node gate: the browser JS pH host-loop methods (converged_mcmc, converged_mcmc_combined, two_phase, gibbs; Potts backend) vs aminx design_methods on replayed draws"
created = "261010"
schema_version = "0.3"

[experiment]
hypothesis = """
browser/protonpotts-scorer/ph_design.mjs (PhDesigner.design with config.method in {converged_mcmc, converged_mcmc_combined, two_phase,
gibbs}, backend "potts"), run under Node with onnxruntime-web (wasm, 1 thread) on the X6a scoring and X7a pH artifacts (verified by
manifest sha256, not re-exported), reproduces aminx.families.protonpotts_mpnn.ph_methods.design_methods -- the Python port graded against
the upstream P4j oracle by wave protonpotts_ph_methods -- on the same structures from PDB text, when both consume the SAME recorded draws.
The JS methods use only the existing graphs: field_L<bucket> for conditional Potts rows (Python ctx.rows), the energy graph and field_L for
the final score; no new export.

Draw replay: for each (cell, case, sample) the gate first runs the Python method functions with a fresh seeded Draws (seed fixed per case)
to RECORD the draws they consume (uniforms of every pick in order, randints, permutations); that record is then the replay given to BOTH
design_methods(replay=...) (the graded reference) and the JS. The gate asserts the replayed design_methods reproduces the recording run's
sequences (a consistency check on the reference itself).

Cells: 1EL1, 1BVC, 1OLR (bucket 256), 6m0j (bucket 1024; binder chain E), unlabelled, binder chain the last chain (as X7b).
Cases per cell, centre type HIS-P, two samples, production defaults otherwise (cv_patience 3, cv_max 50, two_phase_frac 0.5,
combined_lambda 0.3, selective true, forbidden HIS-A ASP-A GLU-A UNK):
  mcmc_t005 (converged_mcmc, T 0.05), mcmc_t0 (converged_mcmc, T 0: argmin path, randints only), combined_t005 (converged_mcmc_combined,
  T 0.05), two_phase_t005 (two_phase, T 0.05; Python banker's round() of two_phase_frac * N), gibbs_t005 (gibbs, T 0.05: one permutation
  and one uniform per free position per sweep).

A design passes when, in order: the sequence tokens are exactly equal; designable positions, pins, label and n_draws equal; final Potts
energy and selective energy within max|d| / max(1, |ref|) <= 1e-4 (the X7b bar). FRAGILE: a pick whose recorded uniform lies within 1e-5
(of the total mass) of a cumulative-probability boundary on the REFERENCE's probabilities is fragile (numpy f32 softmax and JAX cumsum are
not bit-reproducible in JS); a design whose first sequence difference occurs at or after its first fragile pick is exempt on sequence and
the fields that follow from it, and is reported as fragile, never as a pass. A case passes when every design passes or is fragile-exempt.

Controls (each must make the SAME comparator fail on at least one design of the cases it applies to): TOKENS -- JS designs vs the reference
replayed with every uniform list rolled by one (T > 0 cases); RANDINT -- vs the reference with the randint list rolled by one (mcmc,
combined, two_phase); PERM -- vs the reference with every gibbs permutation reversed (gibbs); ENERGY -- JS final energies vs the reference
energy of the same sequences under a Potts head perturbed by 1e-2 noise on every float leaf (as X7b).

Preemption safety (scheduling only): each (cell, case) runs and persists separately with a completion stamp keyed by the sha256 of its
inputs (PDB, config, replay record, manifest shas, JS module digests); a rerun reuses matching stamps and records them.

PREDICTION, stated before the run so it can be wrong: every case passes, with at most a handful of fragile exemptions concentrated in
gibbs (f32 cumsum on the reference) and combined; all four controls fire. Risks: (a) a draw-order or rounding difference in the JS port
(e.g. Math.round vs banker's) -- a named non-fragile mismatch; (b) 6m0j converge cases being slow (up to cv_max * N steps of field_L calls
at bucket 1024) -- an incomplete run, not a disagreement.
"""
stage_name = "validation"
novel = true
# No [reproduction]: novel. Mirrors protonpotts_ph_loop_gate (X7b) and protonpotts_sampler_gate (X8b).

[controls]
positive_outcome = ["pass"]
negative_outcome = ["error", "instrument_unverified", "fail"]

# Declaration ORDER is load-bearing: bathos takes the FIRST matching branch.

[outcomes.error]
condition = "jax_arm_ok = false OR artifacts_verified = false OR node_ok = false OR reference_consistent = false"
decision = "The reference, the artifact check, the Node run or the reference's own replay consistency did not hold. Cite nothing."
reasoning = "Without a complete, self-consistent reference there is nothing to grade the JS against."
is_residual = true

[outcomes.instrument_unverified]
condition = "NOT (control_tokens_detected = true AND control_randint_detected = true AND control_perm_detected = true AND control_energy_detected = true)"
decision = "A planted difference (rolled uniforms, rolled randints, reversed permutations, perturbed head) was not flagged. Passes are not evidence."
reasoning = "A comparator that cannot see a changed draw stream would also pass a port that ignores it."
is_residual = true

[outcomes.pass]
condition = "n_cases > 0 AND n_pass = n_cases"
decision = "The JS host-loop methods reproduce aminx design_methods on replayed draws for every case (fragile exemptions reported). converged_mcmc(_combined), two_phase and gibbs on the Potts backend are validated under Node."
reasoning = "Licenses 'validated under Node' for these cases only; a browser (Chromium) regrade of the pH page and the deployed-site gate are separate."
is_residual = false

[outcomes.fail]
condition = "NOT (n_cases > 0 AND n_pass = n_cases)"
decision = "At least one case has a non-fragile disagreement. The per-design record names the case, sample, field and first differing pick."
reasoning = "Same draws, same graphs: a non-fragile difference localises to the JS loop."
is_residual = true

[result_schema]
scoring_manifest_sha256 = "str"
ph_manifest_sha256 = "str"
artifacts_verified = "bool"
jax_arm_ok = "bool"
node_ok = "bool"
reference_consistent = "bool"
jax_version = "str"
onnxruntime_web_version = "str"
node_version = "str"
git_hash = "str"
git_clean = "bool"
n_cases = "int"
n_pass = "int"
n_fragile_designs = "int"
cases = "list"
units_reused = "list"
control_tokens_detected = "bool"
control_randint_detected = "bool"
control_perm_detected = "bool"
control_energy_detected = "bool"
error = "str"

[dependencies]
aminx_version = { type = "git_sha", required = true }

[data]
checkpoint = "ProtonPottsMPNN v6 epoch-0125, sha256 a39872250c0b8eb4c0b4cb6472a6edad0d6f6134a50c28b611386e83c592fe7b"
artifacts = "X6a 40b4318e (scoring 7b2087dc...9243), X7a d5918c26 (ph 131a65cb...6fe7319)"
tolerances = "tokens/pins/n_draws exact (fragile-exempt from the first fragile pick, reported); energies max|d|/max(1,|ref|) <= 1e-4; fragile margin 1e-5 of total mass"

[provenance]
note = "Pre-registered at the commit that adds this file, before the JS methods and protonpotts_ph_methods_node_gate.py exist and before any JS method output exists."
