[metadata]
title = "ProteinEBM Decoy-Ranking Throughput/Latency Benchmark (JAX vs PyTorch)"
created = "260709"
schema_version = "0.3"

[benchmark]
# No PyTorch baseline run has been recorded in the bathos catalog yet -- this
# script has only been run locally (CPU, --smoke/--dry-run L1/L2 gates), not
# via `bth run` against the real checkpoint, so there is no run_uuid to pin.
# Set this to the run_uuid of the first `bth run` invocation of this script
# against the real ProteinEBM checkpoint (impl="pytorch" rows) -- see
# decoy_benchmark.py's --checkpoint/--reference-repo flags.
baseline_ref = "TODO: set after first PyTorch baseline bth run (see decoy_benchmark.py module docstring)"
metric = "energy_evals_per_sec"
regression_threshold = 0.05
regression_threshold_basis = "Matches the EPIC design spec §8.3's own benchmark.bth.toml template value; no prior aminx EBM benchmark run exists yet to derive an empirical noise floor from, so 5% is the standing aminx-wide bathos benchmark convention (same value used by scripts/benchmarks/*.bth.toml) pending a real baseline run's variance estimate."
target = "JAX >= PyTorch throughput on pi_so3 (SM120) at L in {64,128,256,512} (design spec §8.3; EPIC DAG §4.3)"

[result_schema]
energy_evals_per_sec = "float"
score_grad_ms = "float"
protein_length = "int"
batch_size = "int"
device = "str"
impl = "str"  # "jax" | "pytorch"
pytorch_variant = "str"  # null (jax rows) | "eager" | "shipped" | "compiled"
energy_wall_clock_mean_ms = "float"
energy_wall_clock_std_ms = "float"
score_wall_clock_mean_ms = "float"
score_wall_clock_std_ms = "float"
compile_error = "str"  # null unless pytorch_variant="compiled" and torch.compile itself raised

[result_schema.provenance]
n_decoys = { type = "int", doc = "DEPRECATED alias -- see batch_size in result_schema; kept for backward-compat with pre-batch-sweep runs" }
n_repeats = { type = "int", doc = "Timed repeats averaged into this row's metrics, after the untimed warmup call" }
diffusion_time = { type = "float", doc = "Fixed VP-SDE diffusion time t the row was measured at (ProteinEBM-x MVP target, design spec §9)" }
checkpoint = { type = "str", doc = "Path to the ProteinEBM PyTorch-Lightning checkpoint ported for this run, or null under --smoke" }
smoke = { type = "bool", doc = "True if this run used the reduced-scale --smoke architecture (tiny random-init dims, not the real 85M-param checkpoint) -- see decoy_benchmark.py module docstring" }
xla_shard_autotuning_workaround_applied = { type = "bool", doc = "Must be true for any GPU/pi_so3 (SM120) run per ~/.claude/rules/CLUSTER.md -- false/absent on CPU-only local runs" }

[dependencies]
aminx_version = { type = "git_sha", required = true, doc = "aminx commit SHA (worktree-proteinebm-decomposition)" }
jax_version = { type = "string", required = true, doc = "JAX version used in run" }
torch_version = { type = "string", required = true, doc = "PyTorch reference baseline version" }
proteinebm_checkpoint = { type = "string", required = false, doc = "Checkpoint filename/hash ported for the PyTorch/JAX comparison (absent under --smoke)" }
