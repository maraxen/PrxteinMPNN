[metadata]
title = "ProteinEBM Langevin Sampler Throughput/Latency Benchmark (JAX vs PyTorch)"
created = "260710"
schema_version = "0.3"

[experiment]
hypothesis = """
JAX (aminx.ebm.langevin.langevin_step / run_langevin_equilibration) throughput
(langevin_steps_per_sec) is >= PyTorch throughput on pi_so3 (SM120) at protein length L in
{64,128,256,512}, single fixed noise level t, use_metropolis=False -- the sidecar's original
[benchmark] target, carried over verbatim (design spec §8.3; EPIC DAG §4.3).
metric = langevin_steps_per_sec; regression_threshold = 0.05 (matches the sibling
E11a/E11b/E11c sidecars' own convention; no prior aminx Langevin-sampler benchmark run exists
yet to derive an empirical noise floor from).
"""
reasoning = """
This sidecar gates SINGLE-RUN VALIDITY ONLY, not the cross-run JAX-vs-PyTorch comparison the
hypothesis states (matches the sibling convention in
scripts/benchmarks/benchmark_joint_asr_scorer_device.bth.toml and decoy_benchmark.bth.toml). No
PyTorch baseline run has ever been recorded in the bathos catalog yet -- baseline_ref is still
the original placeholder "TODO: set after first PyTorch baseline bth run".

STRUCTURAL NOTE: langevin_benchmark.py's `_write_payload` writes `{"meta": {...}, "results":
[...]}` -- both top-level keys are nested. bathos's evaluate_outcome() therefore sees
`meta`/`results` as inert JSON-text columns (bathos/src/bathos/sidecar.py's _sql_literal).
DuckDB's json_extract_string() reads a scalar back out; verified against this exact bathos
version (0.12.0) before relying on it here, per BATHOS.md's measurement-verification discipline.
"""

[outcomes.measurement_valid]
condition = "CAST(json_extract_string(meta, '$.smoke') AS BOOLEAN) = false"
decision = "Valid real-scale timing measurement (not --smoke). Record per-(length, impl) langevin_steps_per_sec/langevin_step_ms rows from `results` for the cross-run JAX-vs-PyTorch comparison -- a separate reanalysis once a PyTorch baseline run exists."
reasoning = "meta.smoke=false confirms this is a real-scale run against the ported checkpoint, not the tiny random-init --smoke architecture."
is_residual = false

[outcomes.smoke_or_unparseable]
condition = "1 = 1"
decision = "Either a --smoke run (expected, local L1/L2 validation only -- do NOT use for the JAX-vs-PyTorch throughput comparison) or a run whose meta.smoke could not be parsed as a boolean (investigate before trusting the number)."
reasoning = "Residual catch-all per bathos v2 discipline -- exactly one outcome must be is_residual=true."
is_residual = true

[result_schema]
meta = "str"    # JSON-encoded object; see [experiment].reasoning for the json_extract_string pattern used above
results = "str" # JSON-encoded array of per-(length, impl) row dicts (or impl="error" rows if a cell raised); not individually addressable by an outcome condition

# Documentation only, below -- the shape of each element inside the `results` JSON array above.
langevin_steps_per_sec = "float"
langevin_step_ms = "float"
langevin_step_ms_std = "float"
equilibration_wall_clock_mean_ms = "float"
equilibration_wall_clock_std_ms = "float"
protein_length = "int"
batch_size = "int"
device = "str"
impl = "str"  # "jax" | "pytorch"
# NOTE: no pytorch_variant/compile dimension here -- this path never calls
# jax.grad/torch.autograd.grad (aux_score only), so there is no create_graph
# distinction to make (see decoy/ddg sidecars for where that applies).

[result_schema.provenance]
n_trajectories = { type = "int", doc = "DEPRECATED alias -- see batch_size in result_schema; kept for backward-compat with pre-batch-sweep runs" }
n_steps = { type = "int", doc = "Euler-Maruyama steps per trajectory in the langevin_steps_per_sec metric's batched equilibration run" }
n_repeats = { type = "int", doc = "Timed repeats averaged into this row's metrics, after the untimed warmup call" }
diffusion_time = { type = "float", doc = "Fixed VP-SDE diffusion time t the row was measured at (ProteinEBM-x MVP target, design spec §9)" }
dt = { type = "float", doc = "Euler-Maruyama step size (matches run_dynamics.py's --dt default, 0.001)" }
checkpoint = { type = "str", doc = "Path to the ProteinEBM PyTorch-Lightning checkpoint ported for this run, or null under --smoke" }
smoke = { type = "bool", doc = "True if this run used the reduced-scale --smoke architecture (tiny random-init dims, not the real 85M-param checkpoint) -- see langevin_benchmark.py module docstring" }
use_metropolis = { type = "bool", doc = "Always false for this script -- only the plain Euler-Maruyama langevin_step path is benchmarked, not metropolis_hastings_step" }
xla_shard_autotuning_workaround_applied = { type = "bool", doc = "Must be true for any GPU/pi_so3 (SM120) run per ~/.claude/rules/CLUSTER.md -- false/absent on CPU-only local runs" }

[dependencies]
aminx_version = { type = "git_sha", required = true, doc = "aminx commit SHA (worktree-proteinebm-decomposition)" }
jax_version = { type = "string", required = true, doc = "JAX version used in run" }
torch_version = { type = "string", required = true, doc = "PyTorch reference baseline version" }
proteinebm_checkpoint = { type = "string", required = false, doc = "Checkpoint filename/hash ported for the PyTorch/JAX comparison (absent under --smoke)" }
