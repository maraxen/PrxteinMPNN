[metadata]
title = "ProteinEBM E5 real Rosetta decoy-ranking accuracy check (paper target: Spearman 0.838)"
created = "260716"
schema_version = "0.3"

[experiment]
hypothesis = "The JAX-ported ProteinEBM-x reproduces the paper's published decoy-ranking Spearman(E, TM-score) correlation on the real Rosetta decoy set (133 native structures, ~957 decoys each), at the design spec's own pinned t=0.05."
stage_name = "exploration"
novel = true
# Full-scale confirmatory runs (--max-natives unset) additionally discriminate the
# ebm-ddg-decoy-literature-parity claim (campaign aba3bfe6) -- see that claim's
# C_decoy_reproduced union-gate clause. Smoke-scale runs (--max-natives set) are NOT
# claim-discriminating; they're pre-registered signal checks only.
claim_discriminates = ["H_fix_sufficient", "H_null_misspec"]

[outcomes.pass]
condition = "n_natives_scored >= 3 AND mean_spearman_at_pinned_t_abs >= 0.5"
decision = "Real accuracy signal present at meaningful strength; scale to the full 133-native set and register as a claim.bth.toml confirmatory campaign."
reasoning = "A correlation this strong on a small subset is unlikely to be pure sampling noise -- worth the larger confirmatory run."
is_residual = false

[outcomes.marginal]
condition = "n_natives_scored >= 3 AND mean_spearman_at_pinned_t_abs < 0.5"
decision = "Inconclusive at this sample size -- scale to more natives/decoys before drawing any conclusion either way."
reasoning = "A small native/decoy subset has high sampling variance; a weak result here does not itself falsify the port."
is_residual = false

[outcomes.fail]
condition = "n_natives_scored < 3"
decision = "Investigate data loading / length-matching pipeline before trusting any correlation."
reasoning = "Losing almost all natives to parse failures or length mismatches signals a real pipeline bug, not sampling noise."
is_residual = true

[result_schema]
n_natives_scored = "int"
n_natives_total = "int"
pinned_t = "float"
paper_target = "float"
mean_spearman_at_pinned_t_signed = "float"
mean_spearman_at_pinned_t_abs = "float"
mean_best_spearman_signed = "float"
mean_best_spearman_abs = "float"

[dependencies]
aminx_version = { type = "git_sha", required = true }
jax_version = { type = "string", required = true }
proteinebm_checkpoint = { type = "string", required = true, doc = "model_6_expert_frozen_1m_md.pt (ProteinEBM-x)" }

[provenance]
note = "Real data: Rosetta decoy set (files.ipd.uw.edu/pub/decoyset/decoys.zip, 133 natives) + real TM-score labels (huggingface.co/jproney/ProteinEBM rmsd/rosettascore/tmscore.txt). Sign convention: raw Spearman(E,TMscore) is expected negative (lower E = more native-like, higher TMscore = more native-like) -- compare abs value against paper_target, per the script's own sign_convention_note in its output JSON."
