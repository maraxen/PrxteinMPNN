[metadata]
title = "ProtonPottsMPNN pH-design knob dump: upstream block descent with sweep_order knn / energy on the sealed tables, f32 and f64 (P4k, #2621)"
created = "261010"
schema_version = "0.3"

[experiment]
hypothesis = """
Debt #2621, phase 1. Same harness, cells, precisions, sealed inputs, inverse-CDF shim and per-call records as the sealed P4g dump
(scripts/protonpotts/dump_protonpotts_ph.py, run under its own sidecar), with the block-descent VISIT ORDER knob set:
four configurations, the P4g block-descent production values otherwise -- block_knn_T0 and block_knn_T05 (sweep_order "knn": designable
positions ordered by their best rank in any pinned centre's E_idx list, ties by index; upstream _knn_rank), block_energy_T0 and
block_energy_T05 (sweep_order "energy": ordered by the summed |selective-gap contribution| of each position at the seed, descending,
ties by index; upstream _centre_energy_rank). Cells 1BVC chain A, 6m0j binder chain E, 1OLR chain A, 1EL1 chain A; float32 and float64.
Recorded per call additionally: the configured knob values and the visit order the engine actually used (the reordered designable list).

Claims, falsifiable by this run:

1. THE ENGINE SEES THE SEALED INPUTS (as P4g claim 1).
2. COMPLETE. Every cell and precision carries all four configurations with z-scales and the recorded visit order.
3. THE SHIM IS THE ONLY RANDOMNESS. Every T=0 call consumes zero uniforms and every T>0 call at least one.
4. THE f64 RUN IS REALLY DOUBLE (as P4g claim 4).
5. REPRODUCIBLE. A second run in a fresh process gives identical content and metadata hashes, threads pinned to 1.
6. THE KNOB IS LIVE (the control that makes this oracle a test): for each of knn and energy, in at least one cell the recorded visit order
   differs from the position order (the P4g designable order) -- otherwise a port that ignores sweep_order would pass against it.

Recorded, not required: per cell, whether the final designs differ from the P4g sweep_order "position" designs of the same temperature.
"""
stage_name = "confirmation"
novel = false

[outcomes.pass]
condition = "engine_matches_sealed AND complete AND shim_consistent AND f64_is_float64 AND precisions_differ AND reproducible AND knn_order_live AND energy_order_live AND n_cells = 4"
decision = "Seal the dump and grade the aminx sweep_order port against it."
reasoning = "All P4g claims hold for the knob configurations, and the visit order really changes, so the oracle can tell a port that honours the knob from one that ignores it."
is_residual = false
adversarial_check = "NOT (engine_matches_sealed AND complete AND shim_consistent AND f64_is_float64 AND precisions_differ AND reproducible AND knn_order_live AND energy_order_live AND n_cells = 4)"

[outcomes.fail]
condition = "NOT (engine_matches_sealed AND complete AND shim_consistent AND f64_is_float64 AND precisions_differ AND reproducible AND knn_order_live AND energy_order_live AND n_cells = 4)"
decision = "Do not seal. Read which flag is false; an order flag false means the knob did not change the visit order in any cell and these cells cannot grade it."
reasoning = "At least one claim is false."
is_residual = true
adversarial_check = "engine_matches_sealed AND complete AND shim_consistent AND f64_is_float64 AND precisions_differ AND reproducible AND knn_order_live AND energy_order_live AND n_cells = 4"

[result_schema]
engine_matches_sealed = "bool"
complete = "bool"
shim_consistent = "bool"
f64_is_float64 = "bool"
precisions_differ = "bool"
reproducible = "bool"
knn_order_live = "bool"
energy_order_live = "bool"
n_cells = "int"

[dependencies]
aminx_version = { type = "git_sha", required = true, doc = "aminx commit SHA" }

[data]
upstream = "ProtonPottsMPNN @ 09682abf, PottsMPNNPHEngine (inference_engines/potts_mpnn_ph.py): _knn_rank L2180, _centre_energy_rank L2141, applied L2237-2241"
inputs = "sealed P4e dump (run 60351d47) merged tables and E_idx; sealed P4b/P4c/P4d feature dumps (native S); the P4g dump for the position-order comparison"
cells = "pkad_unlabelled=1BVC chain A; multichain=6m0j binder chain E; only_o_1olr=1OLR chain A; gap=1EL1 chain A"
configurations = "P4g block-descent production values (block_size 3, combined_lambda 0.3, neighbour_k 16, max_mutations 20, repetitive window 1.0/2, forbidden HIS-A ASP-A GLU-A UNK, v6 dep_map, centre types HIS-P ASP-P GLU-P, scan_potts) with sweep_order knn or energy; T 0 (1 sample) and 0.05 (2 samples)"
threads = "OMP/MKL/OPENBLAS_NUM_THREADS=1 before torch import, torch.set_num_threads(1)"

[provenance]
note = "Pre-registered before dump_protonpotts_ph_knobs.py exists. Graded invocation as P4g's (bth run in the aminx-oracles-protonpotts env from a clean checkout of a commit containing this file and the script)."
