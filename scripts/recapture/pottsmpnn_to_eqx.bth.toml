[run]
script = "scripts/recapture/pottsmpnn_to_eqx.py"
description = "Recapture PottsMPNN .pt checkpoint weights to aminx.eqx.zst format"

[metadata]
# Experiment tracking metadata for reproducibility
run_type = "recapture"
domain = "potts-integration"
task_id = "260605_multistate-potts"
track = "C — P-01"

[inputs]
# Required CLI arguments for the recapture run
checkpoint = "path/to/model.pt"
pdb = "path/to/structure.pdb"
pottsmpnn_root = "path/to/PottsMPNN"

[outputs]
# Output checkpoint saved as .eqx.zst
checkpoint_path = "path/to/potts_<id>.eqx.zst"

[hypotheses]
# Pre-registered hypotheses for validation
hypothesis_1 = "h and J scale factors match etab_to_dense_h_j_w reference (x2 scale from directed-slot convention)"
hypothesis_2 = "k_neighbors metadata is correctly extracted from loaded PottsMPNN model config and stored in checkpoint"
hypothesis_3 = "Checkpoint deserialization via eqx.tree_deserialise_leaves loads all required fields without loss"

[measurement]
# Validation and sanity checks
sanity_check = "--sanity flag enables synthetic 2-residue energy validation"
dry_run = "--dry-run flag validates paths without running inference"

[notes]
# Implementation notes
x2_scale_note = "Directed-slot PottsMPNN convention: each pairwise edge counted twice in etab. h and J multiplied by 2.0 to match calc_eners energy calculation. See ADR 260605_potts-parallel-not-stageset."
k_neighbors_note = "Read from loaded model configuration (model.k_neighbors), not CLI args. Baked into checkpoint metadata for reproducibility."
torch_import_note = "torch import deferred to function body (load_etab_from_pottsmpnn_checkpoint) to avoid hard dependency at module load time."
sanity_check_note = "Synthetic 2-residue check only executes when --sanity flag is explicitly passed. Default run must NOT execute JAX computation."
