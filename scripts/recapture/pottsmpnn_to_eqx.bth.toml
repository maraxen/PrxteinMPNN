# Bathos tracking sidecar for PottsMPNN → Equinox checkpoint conversion
# This documents the run parameters, hypotheses, and reproducibility metadata.

[experiment]
run_id = "pottsmpnn_to_eqx_v1"
script = "scripts/recapture/pottsmpnn_to_eqx.py"
date_created = "2026-06-05"

[description]
title = "PottsMPNN checkpoint to Equinox .eqx.zst conversion"
summary = """
Convert PottsMPNN PyTorch checkpoints to Equinox format (.eqx.zst) with metadata.
Uses etab_to_dense_h_j_w from mistypotts to generate h, J, W tensors.
Preserves x2 scale factor (directed-slot convention).
k_neighbors read from loaded model config, not CLI args.
"""

[hypotheses]
# Pre-registered hypotheses for weight recapture verification
h1 = "h, J values from etab_to_dense_h_j_w match reference implementations within 1e-6"
h2 = "x2 scale factor is correctly preserved in saved checkpoint"
h3 = "k_neighbors from model config matches checkpoint structure"
h4 = "Zstandard-compressed .eqx.zst file can be round-tripped (load == save)"

[command_template]
# Example invocation (user must fill in paths)
example = """
uv run scripts/recapture/pottsmpnn_to_eqx.py \\
  --checkpoint /path/to/model.pt \\
  --pdb /path/to/structure.pdb \\
  --pottsmpnn-root /path/to/PottsMPNN \\
  --out /path/to/output.eqx.zst \\
  --num-edges 48 \\
  --verbose
"""

[flags]
checkpoint = "Path to PottsMPNN .pt checkpoint (required)"
pdb = "Path to PDB file for featurization (required)"
pottsmpnn_root = "Path to PottsMPNN checkout KeatingLab/PottsMPNN (required)"
out = "Output .eqx.zst file path (required)"
num_edges = "k_neighbors parameter (default 48)"
dry_run = "Validate paths and config without conversion (default false)"
verbose = "Enable verbose logging (default false)"

[dependencies]
torch = "For PottsMPNN checkpoint loading and inference"
mistypotts = "For etab_to_dense_h_j_w and PottsMPNN utilities"
equinox = "For Equinox Module serialization"
jax = "JAX arrays for output tensors"
zstandard = "Compression for .eqx.zst files"

[artifacts]
# Output files produced by this script
output_checkpoint = "*.eqx.zst (Equinox checkpoint with h, J, W, k_neighbors)"
metadata = "*.json (Sidecar with k_neighbors, n_residues, vocab_size, source paths)"

[validation]
synthetic_test = "tests/potts/test_pottsmpnn_conversion.py::test_etab_to_dense_h_j_w_synthetic_2residue"
checkpoint_format_test = "tests/potts/test_pottsmpnn_conversion.py::test_save_potts_checkpoint_format"
config_extraction_test = "tests/potts/test_pottsmpnn_conversion.py::test_k_neighbors_from_model_config"
all_tests = "uv run pytest tests/potts/test_pottsmpnn_conversion.py -v"

[notes]
architecture_decision = "See .praxia/docs/specs/260605_integration-architecture-for-mistypotts.md (Approach A+D)"
adr_x2_scale = "x2 scale factor documented in ADR 260605_potts-parallel-not-stageset"
scope = "Phase 1: Weight recapture from PottsMPNN checkpoints"
next_steps = "Build PottsModel(eqx.Module) to consume these weights; integrate with PottsRunSpec"
