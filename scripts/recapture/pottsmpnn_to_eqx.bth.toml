# Bathos tracking sidecar for PottsMPNN → Equinox checkpoint conversion
# Pre-registered hypotheses and outcome conditions for weight recapture verification.

[experiment]
hypothesis = "etab_to_dense_h_j_w correctly converts PottsMPNN (etab, E_idx) to dense (h, J, W) with x2 scale, and k_neighbors is extracted from model config, and checkpoint round-trips via eqx.tree_serialise_leaves + zstandard"

[description]
title = "PottsMPNN checkpoint to Equinox .eqx.zst conversion"
summary = """
Convert PottsMPNN PyTorch checkpoints to Equinox format (.eqx.zst) with metadata.
Uses etab_to_dense_h_j_w from mistypotts to generate h, J, W tensors.
Preserves x2 scale factor (directed-slot convention).
k_neighbors read from loaded model config, not CLI args.
Validates via synthetic 2-residue check against hand-crafted ground truth.
"""

[outcomes.pass]
condition = "h_max_abs_err < 1e-6 AND j_max_abs_err < 1e-6 AND k_neighbors_match = true AND checkpoint_roundtrip_ok = true"
is_residual = false

[outcomes.marginal]
condition = "h_max_abs_err < 1e-5 AND j_max_abs_err < 1e-5 AND k_neighbors_match = true AND checkpoint_roundtrip_ok = true"
is_residual = false

[outcomes.fail]
condition = "h_max_abs_err >= 1e-5 OR j_max_abs_err >= 1e-5 OR k_neighbors_match = false OR checkpoint_roundtrip_ok = false"
is_residual = true

[result_schema]
h_max_abs_err = "float"
j_max_abs_err = "float"
k_neighbors_match = "bool"
checkpoint_roundtrip_ok = "bool"
vocab_size = "int"
n_residues = "int"
checkpoint_source = "str"

[command_template]
# Example invocation (user must fill in paths)
example = """
uv run scripts/recapture/pottsmpnn_to_eqx.py \\
  --checkpoint /path/to/model.pt \\
  --pdb /path/to/structure.pdb \\
  --pottsmpnn-root /path/to/PottsMPNN \\
  --out /path/to/output.eqx.zst \\
  --num-edges 48 \\
  --verbose
"""

[dependencies]
torch = "For PottsMPNN checkpoint loading and inference"
mistypotts = "For etab_to_dense_h_j_w and PottsMPNN utilities"
equinox = "For Equinox Module serialization"
jax = "JAX arrays for output tensors"
zstandard = "Compression for .eqx.zst files"

[artifacts]
output_checkpoint = "*.eqx.zst (Equinox checkpoint with h, J, W, k_neighbors)"
metadata = "*.json (Sidecar with k_neighbors, n_residues, vocab_size, source paths)"

[validation]
synthetic_test = "tests/potts/test_poe.py::test_synthetic_2residue_check (hand-crafted h,J vs etab)"
checkpoint_format_test = "tests/potts/test_poe.py::test_save_potts_checkpoint_format"
config_extraction_test = "tests/potts/test_poe.py::test_k_neighbors_from_model_config"
all_tests = "uv run pytest tests/potts/ -v -k pottsmpnn"

[notes]
architecture_decision = "See .praxia/docs/decisions/260605_potts-parallel-not-stageset.md"
adr_x2_scale = "x2 scale factor documented in ADR 260605_potts-parallel-not-stageset"
scope = "Phase 1: Weight recapture from PottsMPNN checkpoints"
next_steps = "Build PottsModel(eqx.Module) to consume these weights; integrate with PottsRunSpec"
